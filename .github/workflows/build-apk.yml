                          pick.setType("image/*");
                          pick.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION);
                          startActivityForResult(pick,PICK_AVATAR);
                      } catch (Exception e) {
                          Toast.makeText(this,"Could not open the phone gallery.",Toast.LENGTH_LONG).show();
                      }
                  });
                  card("Website sync", "Your profile details and picture are saved to the same NileSoniQ account used by the website.");
                  action("Save Profile", () -> {
                      String name = nameInput.getText().toString().trim();
                      String bio = bioInput.getText().toString().trim();
                      String location = locationInput.getText().toString().trim();
                      if (name.isEmpty()) { Toast.makeText(this,"Artist name is required.",Toast.LENGTH_LONG).show(); return; }
                      final String userId = signedInUser.optString("id", signedInUser.optString("user_id", ""));
                      if (userId.isEmpty()) { Toast.makeText(this,"Please sign in again before saving.",Toast.LENGTH_LONG).show(); return; }
                      Toast.makeText(this,"Saving your profile…",Toast.LENGTH_SHORT).show();
                      new Thread(() -> {
                          try {
                              String photo = currentPhoto;
                              if (selectedAvatarUri != null) photo = uploadObject(selectedAvatarUri,"avatars",userId,"artist_avatar");
                              final String savedPhoto = photo;
                              JSONObject payload = new JSONObject();
                              payload.put("user_id", userId);
                              payload.put("name", name);
                              payload.put("bio", bio);
                              payload.put("location", location.isEmpty() ? "Uganda" : location);
                              payload.put("avatar_url", savedPhoto);
                              ApiResult result = request("POST", "/api/db/artists", payload);
                              if (result.code < 200 || result.code >= 300 || result.body == null || (result.body.has("error") && !result.body.isNull("error"))) {
                                  String message = result.body == null ? "Could not save artist profile (HTTP " + result.code + ")." : result.body.optString("error", "Profile save failed.");
                                  runOnUiThread(() -> Toast.makeText(this,message,Toast.LENGTH_LONG).show());
                                  return;
                              }
                              runOnUiThread(() -> {
                                  try {
                                      signedInUser.put("artist_name", name);
                                      signedInUser.put("name", name);
                                      signedInUser.put("bio", bio);
                                      signedInUser.put("location", location.isEmpty() ? "Uganda" : location);
                                      signedInUser.put("avatar_url", savedPhoto);
                                      JSONObject artistRow = result.body.optJSONObject("data");
                                      if (artistRow != null) {
                                          signedInUser.put("artist_id", artistRow.optString("id", ""));
                                      }
                                  } catch (Exception ignored) {}
                                  selectedAvatarUri = null;
                                  Toast.makeText(this,"Artist profile and picture saved.",Toast.LENGTH_LONG).show();
                                  artistDashboard();
                              });
                          } catch (Exception e) {
                              String message = e.getMessage() == null ? "Profile save failed. Please try again." : e.getMessage();
                              runOnUiThread(() -> Toast.makeText(this,message,Toast.LENGTH_LONG).show());
                          }
                      }).start();
                  });
                  action("Back to Settings", this::artistSettings);
              }

