                              approvedPlays += Math.max(0,song.optLong("plays",0));
                          }
                      }
                      double grossEarnings=approvedPlays*0.5d;
                      double reservedWithdrawals=0, withdrawn=0;
                      int pendingWithdrawals=0;
                      for(int i=0;i<withdrawals.length();i++) {
                          JSONObject w=withdrawals.optJSONObject(i); if(w==null) continue;
