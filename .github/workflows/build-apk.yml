name: NileSoniQ Android APK

'on':
push:
branches:
- main
workflow_dispatch:

permissions:
contents: read

jobs:
build:
name: Build NileSoniQ APK
runs-on: ubuntu-latest
timeout-minutes: 30

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3
    with:
      packages: platform-tools

  - name: Install Android SDK packages
    shell: bash
    run: |
      set -euxo pipefail
      sdkmanager --install \
        "platform-tools" \
        "platforms;android-34" \
        "build-tools;34.0.0"

  - name: Install Gradle
    shell: bash
    run: |
      set -euxo pipefail
      wget -nv https://services.gradle.org/distributions/gradle-8.5-bin.zip
      unzip -q gradle-8.5-bin.zip
      echo "$GITHUB_WORKSPACE/gradle-8.5/bin" >> "$GITHUB_PATH"
      "$GITHUB_WORKSPACE/gradle-8.5/bin/gradle" --version

  - name: Generate Android project
    shell: bash
    run: |
      set -euxo pipefail

      mkdir -p app/src/main/java/com/nilesoniq/app
      mkdir -p app/src/main/res/values

      cat > settings.gradle <<'EOF'
      pluginManagement {
          repositories {
              google()
              mavenCentral()
              gradlePluginPortal()
          }
      }

      dependencyResolutionManagement {
          repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
          repositories {
              google()
              mavenCentral()
          }
      }

      rootProject.name = 'NileSoniQ'
      include ':app'
      EOF

      cat > build.gradle <<'EOF'
      plugins {
          id 'com.android.application' version '8.1.4' apply false
      }
      EOF

      cat > app/build.gradle <<'EOF'
      plugins {
          id 'com.android.application'
      }

      android {
          namespace 'com.nilesoniq.app'
          compileSdk 34

          defaultConfig {
              applicationId 'com.nilesoniq.app'
              minSdk 23
              targetSdk 34
              versionCode 3
              versionName '1.2'
          }

          compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
          }
      }
      EOF

      cat > app/src/main/res/values/strings.xml <<'EOF'
      <resources>
          <string name="app_name">NileSoniQ</string>
      </resources>
      EOF

      cat > app/src/main/res/values/styles.xml <<'EOF'
      <resources>
          <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
              <item name="android:fontFamily">sans</item>
              <item name="android:colorAccent">#FF7A00</item>
              <item name="android:statusBarColor">#090909</item>
              <item name="android:navigationBarColor">#090909</item>
              <item name="android:windowLightStatusBar">false</item>
          </style>
      </resources>
      EOF

      cat > app/src/main/AndroidManifest.xml <<'EOF'
      <manifest xmlns:android="http://schemas.android.com/apk/res/android">
          <uses-permission android:name="android.permission.INTERNET" />

          <application
              android:allowBackup="true"
              android:label="@string/app_name"
              android:usesCleartextTraffic="false"
              android:theme="@style/AppTheme">
              <activity
                  android:name=".MainActivity"
                  android:screenOrientation="portrait"
                  android:exported="true">
                  <intent-filter>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent-filter>
              </activity>
          </application>
      </manifest>
      EOF

      cat > app/src/main/java/com/nilesoniq/app/MainActivity.java <<'EOF'
      package com.nilesoniq.app;

      import android.app.Activity;
      import android.os.Bundle;
      import android.graphics.Color;
      import android.graphics.Typeface;
      import android.media.AudioAttributes;
      import android.media.MediaPlayer;
      import android.view.Gravity;
      import android.view.View;
      import android.widget.Button;
      import android.widget.LinearLayout;
      import android.widget.ScrollView;
      import android.widget.TextView;
      import android.widget.Toast;
      import org.json.JSONArray;
      import org.json.JSONObject;
      import java.io.BufferedReader;
      import java.io.InputStreamReader;
      import java.net.HttpURLConnection;
      import java.net.URL;

      public class MainActivity extends Activity {
          private final int bg = Color.rgb(9, 9, 9);
          private final int panel = Color.rgb(23, 23, 23);
          private final int orange = Color.rgb(255, 122, 0);
          private final int white = Color.WHITE;
          private final int muted = Color.rgb(175, 175, 175);

          private LinearLayout root;
          private LinearLayout content;
          private String activeTab = "Home";
          private MediaPlayer player;
          private String currentTitle = "";
          private String currentArtist = "";
          private String currentUrl = "";
          private boolean preparing = false;
          private boolean isPlaying = false;
          private int playbackToken = 0;

          @Override
          protected void onCreate(Bundle state) {
              super.onCreate(state);
              getWindow().setStatusBarColor(bg);
              getWindow().setNavigationBarColor(bg);
              showScreen("Home");
          }

          private int dp(float value) {
              return (int) (value * getResources().getDisplayMetrics().density + 0.5f);
          }

          private TextView text(String value, int size, int color, boolean bold) {
              TextView v = new TextView(this);
              v.setText(value);
              v.setTextSize(size);
              v.setTextColor(color);
              if (bold) v.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
              return v;
          }

          private LinearLayout column() {
              LinearLayout l = new LinearLayout(this);
              l.setOrientation(LinearLayout.VERTICAL);
              return l;
          }

          private LinearLayout.LayoutParams params(int width, int height) {
              return new LinearLayout.LayoutParams(width, height);
          }

          private void space(LinearLayout target, int height) {
              View v = new View(this);
              target.addView(v, params(1, dp(height)));
          }

          private void showScreen(String tab) {
              activeTab = tab;
              root = column();
              root.setBackgroundColor(bg);
              root.setPadding(dp(18), dp(14), dp(18), dp(8));

              LinearLayout header = new LinearLayout(this);
              header.setGravity(Gravity.CENTER_VERTICAL);
              header.setOrientation(LinearLayout.HORIZONTAL);
              TextView brand = text("NileSoniQ", 26, orange, true);
              header.addView(brand, new LinearLayout.LayoutParams(0, -2, 1));
              header.addView(text("MUSIC • COMMUNITY", 10, muted, true));
              root.addView(header);
              space(root, 18);

              ScrollView scroll = new ScrollView(this);
              scroll.setFillViewport(true);
              content = column();
              content.setPadding(0, 0, 0, dp(16));
              scroll.addView(content);
              root.addView(scroll, new LinearLayout.LayoutParams( -1, 0, 1));

              addBottomNavigation();
              setContentView(root);

              if (tab.equals("Home")) home();
              else if (tab.equals("Discover")) discover();
              else if (tab.equals("Player")) playerScreen();
              else if (tab.equals("Community")) community();
              else profile();
          }

          private void heading(String title, String subtitle) {
              content.addView(text(title, 25, white, true));
              space(content, 6);
              content.addView(text(subtitle, 14, muted, false));
              space(content, 20);
          }

          private void card(String title, String description) {
              LinearLayout box = column();
              box.setBackgroundColor(panel);
              box.setPadding(dp(16), dp(15), dp(16), dp(15));
              box.addView(text(title, 17, white, true));
              space(box, 7);
              box.addView(text(description, 13, muted, false));
              LinearLayout.LayoutParams p = params(-1, -2);
              p.bottomMargin = dp(12);
              content.addView(box, p);
          }

          private void button(String label, Runnable action) {
              Button b = new Button(this);
              b.setText(label);
              b.setTextColor(white);
              b.setAllCaps(false);
              b.setBackgroundTintList(
                  android.content.res.ColorStateList.valueOf(orange));
              b.setOnClickListener(v -> action.run());
              LinearLayout.LayoutParams p = params(-1, dp(48));
              p.bottomMargin = dp(12);
              content.addView(b, p);
          }

          private void home() {
              heading("Music from everywhere.",
                  "Discover music. Find artists. Be part of the sound.");
              LinearLayout hero = column();
              hero.setBackgroundColor(panel);
              hero.setPadding(dp(18), dp(20), dp(18), dp(20));
              hero.addView(text("YOUR MUSIC. YOUR COMMUNITY.", 11, orange, true));
              space(hero, 10);
              hero.addView(text("Discover your next favourite sound.", 23, white, true));
              space(hero, 8);
              hero.addView(text(
                  "Explore songs and connect with the people creating them.",
                  14, muted, false));
              LinearLayout.LayoutParams hp = params(-1, -2);
              hp.bottomMargin = dp(16);
              content.addView(hero, hp);
              button("Explore music", () -> showScreen("Discover"));
              button("Open music player", () -> showScreen("Player"));
              content.addView(text("LATEST APPROVED SONGS", 12, orange, true));
              space(content, 12);
              loadSongs();
          }

          private void discover() {
              heading("Discover music", "Tap any song to start listening.");
              button("Refresh songs", this::loadSongs);
              loadSongs();
          }

          private void playerScreen() {
              heading("Music player", "Listen to songs from NileSoniQ.");
              if (currentUrl.isEmpty()) {
                  card("Nothing playing yet",
                      "Open Discover and tap a song to start playback.");
              } else {
                  String state = preparing ? "\nPreparing audio…"
                      : isPlaying ? "\nPlaying now" : "\nPaused";
                  card(currentTitle.isEmpty() ? "Now playing" : currentTitle,
                      (currentArtist.isEmpty() ? "NileSoniQ artist" : currentArtist) + state);
                  button(preparing ? "Preparing…" : isPlaying ? "Pause" : "Play / Resume",
                      this::togglePlayback);
                  button("Stop playback", this::stopPlayback);
              }
              button("Browse songs", () -> showScreen("Discover"));
          }

          private void community() {
              heading("Community", "Connect through music.");
              card("Artist posts",
                  "Music news, releases, achievements and community updates.");
              card("Artist-to-artist chat",
                  "Private conversations and message history will be added in a later stage.");
              button("Explore artists", () -> showScreen("Discover"));
          }

          private void profile() {
              heading("Your account", "Sign-in and artist tools.");
              card("Listener profile",
                  "Registration, sign-in, following artists and your library will be connected in a later stage.");
              card("Artist studio",
                  "Artist statistics, song uploads, review status and earnings require account integration.");
              card("Protected payments",
                  "This app update does not change the existing NileSoniQ payment or withdrawal backend.");
          }

          private void addBottomNavigation() {
              LinearLayout nav = new LinearLayout(this);
              nav.setOrientation(LinearLayout.HORIZONTAL);
              nav.setGravity(Gravity.CENTER);
              nav.setPadding(0, dp(8), 0, dp(4));
              nav.setBackgroundColor(bg);
              String[] tabs = {"Home", "Discover", "Player", "Community", "Profile"};
              for (String name : tabs) {
                  TextView item = text(name, 10,
                      name.equals(activeTab) ? orange : muted, true);
                  item.setGravity(Gravity.CENTER);
                  item.setPadding(dp(2), dp(10), dp(2), dp(10));
                  item.setOnClickListener(v -> showScreen(name));
                  nav.addView(item, new LinearLayout.LayoutParams(0, -2, 1));
              }
              root.addView(nav, params(-1, -2));
          }

          private void loadSongs() {
              content.addView(text("Loading songs…", 14, muted, false));
              new Thread(() -> {
                  HttpURLConnection connection = null;
                  String result = null;
                  String error = null;
                  try {
                      URL url = new URL(
                          "https://nilesoniq.com/api/db/songs?select=id,title,artist,genre,plays,cover_url,audio_url&eq.approved=1&order=created_at.desc&limit=50");
                      connection = (HttpURLConnection) url.openConnection();
                      connection.setRequestMethod("GET");
                      connection.setConnectTimeout(12000);
                      connection.setReadTimeout(12000);
                      connection.setRequestProperty("Accept", "application/json");
                      int code = connection.getResponseCode();
                      BufferedReader reader = new BufferedReader(new InputStreamReader(
                          code >= 200 && code < 300
                              ? connection.getInputStream()
                              : connection.getErrorStream()));
                      StringBuilder body = new StringBuilder();
                      String line;
                      while ((line = reader.readLine()) != null) body.append(line);
                      reader.close();
                      if (code >= 200 && code < 300) result = body.toString();
                      else error = "Song service returned HTTP " + code + ".";
                  } catch (Exception e) {
                      error = "Couldn't load songs. Check your connection and try again.";
                  } finally {
                      if (connection != null) connection.disconnect();
                  }

                  final String data = result;
                  final String problem = error;
                  runOnUiThread(() -> {
                      if (isFinishing() || content == null) return;
                      if (data == null) {
                          content.addView(text(problem == null
                              ? "Songs are unavailable right now." : problem, 14, muted, false));
                          button("Try again", this::loadSongs);
                          return;
                      }
                      try {
                          JSONArray list;
                          Object parsed = new org.json.JSONTokener(data).nextValue();
                          if (parsed instanceof JSONArray) {
                              list = (JSONArray) parsed;
                          } else if (parsed instanceof JSONObject) {
                              list = ((JSONObject) parsed).optJSONArray("data");
                          } else {
                              list = null;
                          }

                          if (list == null || list.length() == 0) {
                              content.addView(text("No approved songs found yet.", 14, muted, false));
                              return;
                          }

                          for (int i = 0; i < list.length(); i++) {
                              JSONObject song = list.optJSONObject(i);
                              if (song == null) continue;
                              String title = song.optString("title", "Untitled song");
                              String artist = song.optString("artist", "Unknown artist");
                              String genre = song.optString("genre", "Music");
                              String plays = song.optString("plays", "0");

                              LinearLayout row = column();
                              row.setPadding(dp(15), dp(14), dp(15), dp(14));
                              row.setBackgroundColor(panel);
                              row.setClickable(true);
                              row.setFocusable(true);
                              row.addView(text(title, 16, white, true));
                              space(row, 5);
                              row.addView(text(artist + " • " + genre + " • " + plays + " plays",
                                  12, muted, false));
                              space(row, 10);
                              row.addView(text("▶  PLAY SONG", 12, orange, true));
                              row.setOnClickListener(v -> startSong(song));
                              LinearLayout.LayoutParams p = params(-1, -2);
                              p.bottomMargin = dp(10);
                              content.addView(row, p);
                          }
                      } catch (Exception e) {
                          content.addView(text(
                              "The song service returned an unexpected response.",
                              14, muted, false));
                      }
                  });
              }).start();
          }

          private String songAudioUrl(JSONObject song) {
              String audio = song.optString("audio_url", "").trim();
              return audio.equals("null") ? "" : audio;
          }

          private void startSong(JSONObject song) {
              String audioUrl = songAudioUrl(song);
              if (audioUrl.isEmpty() || !audioUrl.startsWith("https://")) {
                  Toast.makeText(this,
                      "This song has no valid secure audio URL yet.",
                      Toast.LENGTH_LONG).show();
                  return;
              }

              stopPlayerOnly();
              int token = ++playbackToken;
              currentTitle = song.optString("title", "Untitled song");
              currentArtist = song.optString("artist", "Unknown artist");
              currentUrl = audioUrl;
              preparing = true;
              isPlaying = false;
              showScreen("Player");

              new Thread(() -> {
                  MediaPlayer newPlayer = new MediaPlayer();
                  try {
                      newPlayer.setAudioAttributes(new AudioAttributes.Builder()
                          .setUsage(AudioAttributes.USAGE_MEDIA)
                          .setContentType(AudioAttributes.CONTENT_TYPE_MUSIC)
                          .build());
                      newPlayer.setDataSource(audioUrl);
                      newPlayer.setOnPreparedListener(mp -> runOnUiThread(() -> {
                          if (token != playbackToken || player != mp || isFinishing()) {
                              try { mp.release(); } catch (Exception ignored) {}
                              return;
                          }
                          preparing = false;
                          try {
                              mp.start();
                              isPlaying = true;
                              showScreen("Player");
                          } catch (Exception e) {
                              isPlaying = false;
                              Toast.makeText(this, "Unable to start playback.",
                                  Toast.LENGTH_LONG).show();
                          }
                      }));
                      newPlayer.setOnCompletionListener(mp -> runOnUiThread(() -> {
                          if (token != playbackToken) return;
                          isPlaying = false;
                          if (!isFinishing()) showScreen("Player");
                      }));
                      newPlayer.setOnErrorListener((mp, what, extra) -> {
                          runOnUiThread(() -> {
                              if (token != playbackToken) return;
                              preparing = false;
                              isPlaying = false;
                              currentUrl = "";
                              stopPlayerOnly();
                              Toast.makeText(this,
                                  "This audio could not be played. Try another song.",
                                  Toast.LENGTH_LONG).show();
                              if (!isFinishing()) showScreen("Player");
                          });
                          return true;
                      });
                      runOnUiThread(() -> {
                          if (token == playbackToken && !isFinishing()) {
                              player = newPlayer;
                          } else {
                              try { newPlayer.release(); } catch (Exception ignored) {}
                          }
                      });
                      newPlayer.prepareAsync();
                  } catch (Exception e) {
                      try { newPlayer.release(); } catch (Exception ignored) {}
                      runOnUiThread(() -> {
                          if (token != playbackToken) return;
                          preparing = false;
                          isPlaying = false;
                          currentUrl = "";
                          Toast.makeText(this,
                              "Could not load this audio. Try another song.",
                              Toast.LENGTH_LONG).show();
                          if (!isFinishing()) showScreen("Player");
                      });
                  }
              }).start();
          }

          private void togglePlayback() {
              if (player == null) {
                  Toast.makeText(this, "Choose a song from Discover first.",
                      Toast.LENGTH_SHORT).show();
                  return;
              }
              try {
                  if (preparing) return;
                  if (player.isPlaying()) {
                      player.pause();
                      isPlaying = false;
                  } else {
                      player.start();
                      isPlaying = true;
                  }
                  showScreen("Player");
              } catch (Exception e) {
                  Toast.makeText(this, "Playback is not available for this song.",
                      Toast.LENGTH_LONG).show();
              }
          }

          private void stopPlayerOnly() {
              playbackToken++;
              MediaPlayer old = player;
              player = null;
              preparing = false;
              isPlaying = false;
              if (old != null) {
                  try { old.setOnPreparedListener(null); } catch (Exception ignored) {}
                  try { old.setOnCompletionListener(null); } catch (Exception ignored) {}
                  try { old.setOnErrorListener(null); } catch (Exception ignored) {}
                  try { old.stop(); } catch (Exception ignored) {}
                  try { old.release(); } catch (Exception ignored) {}
              }
          }

          private void stopPlayback() {
              stopPlayerOnly();
              currentTitle = "";
              currentArtist = "";
              currentUrl = "";
              showScreen("Player");
          }

          @Override
          protected void onStop() {
              super.onStop();
              if (player != null) {
                  try {
                      if (player.isPlaying()) {
                          player.pause();
                          isPlaying = false;
                      }
                  } catch (Exception ignored) {}
              }
          }

          @Override
          protected void onDestroy() {
              stopPlayerOnly();
              super.onDestroy();
          }
      }
      EOF

  - name: Build APK and save diagnostic log
    shell: bash
    run: |
      set -o pipefail
      gradle --no-daemon --stacktrace --info assembleDebug 2>&1 | tee build.log

  - name: Upload build log
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: NileSoniQ-Build-Logs
      path: build.log
      if-no-files-found: ignore
      retention-days: 7

  - name: Verify APK exists
    shell: bash
    run: |
      set -euxo pipefail
      test -s app/build/outputs/apk/debug/app-debug.apk
      ls -lh app/build/outputs/apk/debug/app-debug.apk

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: NileSoniQ-Android-APK
      path: app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
      retention-days: 14
