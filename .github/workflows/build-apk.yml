name: NileSoniQ Android APK

'on':
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build NileSoniQ APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          packages: platform-tools

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euxo pipefail
          sdkmanager --licenses
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Gradle
        shell: bash
        run: |
          set -euxo pipefail
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          echo "$GITHUB_WORKSPACE/gradle-8.5/bin" >> "$GITHUB_PATH"
          "$GITHUB_WORKSPACE/gradle-8.5/bin/gradle" --version

      - name: Generate Android project
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p app/src/main/java/com/nilesoniq/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          # Restore the original NileSoniQ icon (N with NileSoniQ wordmark), optimized for a compact workflow.
          cat > /tmp/nilesoniq-icon.b64 <<'ICON_BASE64'
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          TxgLN1I3Pv5/AbOwHgEV8qK+AAAAAElFTkSuQmCC
          ICON_BASE64
          base64 --decode /tmp/nilesoniq-icon.b64 > app/src/main/res/drawable/icon.png
          rm /tmp/nilesoniq-icon.b64

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = 'NileSoniQ'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.1.4' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.nilesoniq.app'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.nilesoniq.app'
                  minSdk 23
                  targetSdk 34
                  versionCode 6
                  versionName '1.5'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/res/drawable/nilesoniq_logo.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <!-- Launcher mark based on the supplied reference: orange rounded tile and bold white N. -->
              <path android:fillColor="#FF7900" android:pathData="M0,0h108v108h-108z" />
              <path android:fillColor="#FFFF7900" android:pathData="M0,0h108v108h-108z" />
              <path android:fillColor="#FFFFFF" android:pathData="M27,78V30h11l32,31V30h11v48H70L38,47v31z" />
          </vector>
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">NileSoniQ</string>
          </resources>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#FF7A00</item>
                  <item name="android:statusBarColor">#FFFFFF</item>
                  <item name="android:navigationBarColor">#FFFFFF</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:windowLightNavigationBar">true</item>
                  <item name="android:windowBackground">#FFFFFF</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:icon="@drawable/icon"
                  android:usesCleartextTraffic="false"
                  android:theme="@style/AppTheme">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/nilesoniq/app/MainActivity.java <<'EOF'
          package com.nilesoniq.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.media.AudioAttributes;
          import android.media.MediaPlayer;
          import android.content.SharedPreferences;
          import android.content.Intent;
          import android.net.Uri;
          import android.database.Cursor;
          import android.text.InputType;
          import android.text.Editable;
          import android.text.TextWatcher;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.CheckBox;
          import android.widget.ImageView;
          import android.widget.EditText;
          import android.widget.FrameLayout;
          import android.widget.HorizontalScrollView;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;
          import android.util.Log;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.util.LinkedHashSet;
          import java.util.Locale;
          import java.util.Set;

          public class MainActivity extends Activity {
              private static final String API = "https://nilesoniq.com";
              private static final String PREFS = "nilesoniq_session";
              private static final String COOKIE_KEY = "session_cookie";

              // NileSoniQ light theme: white surfaces, orange highlights and readable text.
              private final int bg = Color.rgb(248,247,245);
              private final int panel = Color.rgb(255,255,255);
              private final int orange = Color.rgb(244,119,0);
              private final int white = Color.rgb(32,33,42);
              private final int muted = Color.rgb(105,105,105);
              private final int border = Color.rgb(233,231,228);

              private LinearLayout root, content;
              private LinearLayout songResults, genreFilterBar;
              private EditText songSearchInput;
              private JSONArray cachedSongs = new JSONArray();
              private String selectedGenre = "All";
              private int songRequestId = 0;
              private String homeCategory = "New Releases";

              private String tab = "Home";
              private MediaPlayer player;
              private String title = "", artist = "", audioUrl = "";
              private boolean playing = false, preparing = false;
              private int token = 0;
              private JSONObject signedInUser;
              private JSONObject signedInAdmin;
              private boolean authBusy = false;
              private String authMode = "login";
              private EditText nameInput, phoneInput, emailInput, passwordInput;
              private EditText uploadTitleInput, uploadArtistInput, uploadGenreInput, uploadDescriptionInput;
              private CheckBox uploadRightsCheckbox;
              private Uri selectedAudioUri, selectedCoverUri, selectedAvatarUri;
              private boolean uploadBusy = false;
              private static final int PICK_AUDIO = 6101;
              private static final int PICK_COVER = 6102;
              private static final int PICK_AVATAR = 6103;

              @Override
              public void onCreate(Bundle state) {
                  super.onCreate(state);
                  getWindow().setStatusBarColor(Color.WHITE);
                  getWindow().setNavigationBarColor(Color.WHITE);
                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR |
                      View.SYSTEM_UI_FLAG_LIGHT_NAVIGATION_BAR
                  );
                  screen("Home");
                  checkSession();
              }

              // Read the first available play-count field from a song JSON object.
              // Supports both numeric values and numeric strings returned by the API.
              private long firstLong(JSONObject object, String... keys) {
                  if (object == null || keys == null) return 0L;
                  for (String key : keys) {
                      if (key == null || !object.has(key) || object.isNull(key)) continue;
                      Object value = object.opt(key);
                      if (value instanceof Number) return ((Number) value).longValue();
                      if (value != null) {
                          try { return Long.parseLong(String.valueOf(value).trim()); }
                          catch (NumberFormatException ignored) {
                              try { return (long) Double.parseDouble(String.valueOf(value).trim()); }
                              catch (NumberFormatException ignoredAgain) { }
                          }
                      }
                  }
                  return 0L;
              }

              private int dp(int n) {
                  return (int)(n * getResources().getDisplayMetrics().density + 0.5f);
              }

              private GradientDrawable rounded(int color, int radiusDp, int strokeColor) {
                  GradientDrawable drawable = new GradientDrawable();
                  drawable.setColor(color);
                  drawable.setCornerRadius(dp(radiusDp));
                  if (strokeColor != Color.TRANSPARENT) {
                      drawable.setStroke(dp(1),strokeColor);
                  }
                  return drawable;
              }

              private GradientDrawable circleDrawable(int color) {
                  GradientDrawable drawable = new GradientDrawable();
                  drawable.setShape(GradientDrawable.OVAL);
                  drawable.setColor(color);
                  return drawable;
              }

              private void makeCircular(ImageView image, int fallbackColor) {
                  image.setScaleType(ImageView.ScaleType.CENTER_CROP);
                  image.setBackground(circleDrawable(fallbackColor));
                  image.setClipToOutline(true);
                  image.setAdjustViewBounds(false);
              }

              private TextView label(String s, int size, int color, boolean bold) {
                  TextView v = new TextView(this);
                  v.setText(s);
                  v.setTextSize(size);
                  v.setTextColor(color);
                  if (bold) v.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
                  return v;
              }

              private LinearLayout column() {
                  LinearLayout l = new LinearLayout(this);
                  l.setOrientation(LinearLayout.VERTICAL);
                  return l;
              }

              private void gap(LinearLayout l, int height) {
                  l.addView(new View(this), new LinearLayout.LayoutParams(1, dp(height)));
              }

              private void screen(String name) {
                  try {
                      screenUnsafe(name);
                  } catch (Throwable error) {
                      // Record the real runtime failure and keep the activity alive when possible.
                      Log.e("NileSoniQ", "Could not open tab: " + name, error);
                      try {
                          tab = name;
                          if (root == null) root = column();
                          if (content == null || content.getParent() == null) {
                              root.removeAllViews();
                              content = column();
                              root.addView(content, new LinearLayout.LayoutParams(-1, 0, 1));
                              setContentView(root);
                          } else {
                              content.removeAllViews();
                          }
                          heading("This page could not open", "Your account and saved data have not been changed.");
                          card("Temporary page error", "The app caught an error while opening this page. Try again or return Home.");
                          action("Retry page", () -> screen(name));
                          action("Go to Home", () -> screen("Home"));
                      } catch (Throwable recoveryError) {
                          Log.e("NileSoniQ", "Could not recover tab: " + name, recoveryError);
                          try { Toast.makeText(this, "This page could not open. Please return to Home and try again.", Toast.LENGTH_LONG).show(); } catch (Throwable ignored) {}
                      }
                  }
              }

              private void screenUnsafe(String name) {
                  // Invalidate outstanding song requests whenever a screen is rebuilt.
                  // This prevents older network responses from writing into a new screen.
                  songRequestId++;
                  songResults = null;
                  genreFilterBar = null;
                  songSearchInput = null;

                  tab = name;
                  root = column();
                  root.setBackgroundColor(bg);
                  root.setPadding(dp(18),dp(14),dp(18),dp(8));

                  LinearLayout header = new LinearLayout(this);
                  header.setGravity(Gravity.CENTER_VERTICAL);
                  LinearLayout brand = new LinearLayout(this);
                  brand.setOrientation(LinearLayout.HORIZONTAL);
                  brand.setGravity(Gravity.CENTER_VERTICAL);
                  // In-app wordmark follows the supplied reference: sound-wave mark plus NileSoniQ.
                  TextView soundMark = label(")))",23,orange,true);
                  soundMark.setGravity(Gravity.CENTER);
                  soundMark.setLetterSpacing(0.02f);
                  brand.addView(soundMark,new LinearLayout.LayoutParams(-2,-2));
                  TextView wordmark = label("NileSoniQ",22,orange,true);
                  wordmark.setGravity(Gravity.CENTER_VERTICAL);
                  LinearLayout.LayoutParams wordmarkParams = new LinearLayout.LayoutParams(-2,-2);
                  wordmarkParams.leftMargin = dp(4);
                  brand.addView(wordmark,wordmarkParams);
                  header.addView(brand,new LinearLayout.LayoutParams(-2,-2,1));
                  TextView tagline = label("♫",26,orange,true);
                  tagline.setGravity(Gravity.CENTER_VERTICAL | Gravity.RIGHT);
                  header.addView(tagline);
                  root.addView(header);
                  gap(root,18);

                  ScrollView scroll = new ScrollView(this);
                  content = column();
                  content.setPadding(0,0,0,dp(16));
                  scroll.addView(content);
                  root.addView(scroll,new LinearLayout.LayoutParams(-1,0,1));

                  LinearLayout nav = new LinearLayout(this);
                  nav.setGravity(Gravity.CENTER);
                  nav.setBackground(rounded(Color.WHITE,16,border));
                  nav.setElevation(dp(3));
                  String[] names = {"Home","Discover","Player","Community","Profile"};
                  for (String n : names) {
                      TextView item = label(n,10,n.equals(tab)?orange:muted,true);
                      item.setGravity(Gravity.CENTER);
                      item.setPadding(dp(2),dp(12),dp(2),dp(12));
                      item.setOnClickListener(v -> screen(n));
                      nav.addView(item,new LinearLayout.LayoutParams(0,-2,1));
                  }
                  LinearLayout.LayoutParams navParams =
                      new LinearLayout.LayoutParams(-1,-2);
                  navParams.topMargin = dp(8);
                  root.addView(nav,navParams);
                  setContentView(root);

                  if (name.equals("Home")) home();
                  else if (name.equals("Discover")) discover();
                  else if (name.equals("Player")) playerScreen();
                  else if (name.equals("Community")) community();
                  else if (signedInUser != null) artistDashboard();
                  else profile();
              }

              private void heading(String h, String sub) {
                  content.addView(label(h,25,white,true));
                  gap(content,6);
                  content.addView(label(sub,14,muted,false));
                  gap(content,18);
              }

              private void card(String h, String sub) {
                  LinearLayout box = column();
                  box.setBackground(rounded(Color.WHITE,16,border));
                  box.setElevation(dp(2));
                  box.setPadding(dp(15),dp(14),dp(15),dp(14));
                  box.addView(label(h,17,white,true));
                  gap(box,7);
                  box.addView(label(sub,13,muted,false));
                  LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(-1,-2);
                  p.bottomMargin = dp(12);
                  content.addView(box,p);
              }

              private void action(String name, Runnable run) {
                  Button b = new Button(this);
                  b.setText(name);
                  b.setAllCaps(false);
                  b.setTextColor(Color.WHITE);
                  b.setBackgroundTintList(android.content.res.ColorStateList.valueOf(orange));
                  b.setOnClickListener(v -> {
                      try { run.run(); }
                      catch (Exception error) {
                          Toast.makeText(this, "That action could not be completed. Please try again.", Toast.LENGTH_LONG).show();
                      }
                  });
                  LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(-1,dp(48));
                  p.bottomMargin = dp(10);
                  content.addView(b,p);
              }

              private EditText field(String hint, int type) {
                  EditText e = new EditText(this);
                  e.setSingleLine(true);
                  e.setTextColor(white);
                  e.setHintTextColor(muted);
                  e.setHint(hint);
                  e.setTextSize(15);
                  e.setInputType(type);
                  e.setPadding(dp(12),dp(8),dp(12),dp(8));
                  e.setBackground(rounded(Color.WHITE,12,border));
                  LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(-1,dp(52));
                  p.bottomMargin = dp(10);
                  content.addView(e,p);
                  return e;
              }

              private void home() {
                  // Reference-matched music home: wordmark in the shared app header,
                  // search, three wide tabs, and white rounded song cards.
                  content.addView(label("Search songs, artists, albums...",14,muted,false));
                  EditText search = field("⌕  Search songs, artists, albums...",InputType.TYPE_CLASS_TEXT);
                  search.addTextChangedListener(new TextWatcher() {
                      @Override public void beforeTextChanged(CharSequence s, int start, int count, int after) {}
                      @Override public void onTextChanged(CharSequence s, int start, int before, int count) { renderSongs(); }
                      @Override public void afterTextChanged(Editable s) {}
                  });
                  // Keep one search input as the shared filter used by renderSongs().
                  songSearchInput = search;

                  LinearLayout categories = new LinearLayout(this);
                  categories.setOrientation(LinearLayout.HORIZONTAL);
                  categories.setGravity(Gravity.CENTER_VERTICAL);
                  categories.setBackground(rounded(Color.rgb(224,224,224),12,Color.TRANSPARENT));
                  String[] categoryNames = {"New Releases", "Top Charts", "Trending"};
                  for (String category : categoryNames) {
                      boolean selected = category.equals(homeCategory);
                      LinearLayout tabCell = column();
                      tabCell.setGravity(Gravity.CENTER);
                      tabCell.setPadding(dp(5),dp(12),dp(5),dp(12));
                      tabCell.setBackground(rounded(selected ? Color.WHITE : Color.rgb(224,224,224),10,
                          selected ? border : Color.TRANSPARENT));
                      TextView tabLabel = label(category,12,selected?orange:Color.rgb(35,35,35),true);
                      tabLabel.setGravity(Gravity.CENTER);
                      tabCell.addView(tabLabel);
                      if (selected) {
                          View underline = new View(this);
                          underline.setBackgroundColor(orange);
                          LinearLayout.LayoutParams up = new LinearLayout.LayoutParams(-1,dp(3));
                          up.topMargin = dp(8);
                          tabCell.addView(underline,up);
                      }
                      categories.addView(tabCell,new LinearLayout.LayoutParams(0,-2,1));
                      tabCell.setOnClickListener(v -> {
                          homeCategory = category;
                          screen("Home");
                      });
                  }
                  LinearLayout.LayoutParams catP = new LinearLayout.LayoutParams(-1,-2);
                  catP.topMargin = dp(14);
                  catP.bottomMargin = dp(20);
                  content.addView(categories,catP);

                  String sectionTitle = "Top Charts".equals(homeCategory) ? "Top Charts" :
                      ("Trending".equals(homeCategory) ? "Trending" : "New Releases");
                  content.addView(label(sectionTitle,20,white,true));
                  gap(content,5);
                  String categoryNote = "Trending".equals(homeCategory)
                      ? "Recent releases prioritized • based on available song dates and recorded plays"
                      : ("Top Charts".equals(homeCategory)
                          ? "Ranked by recorded plays among the latest approved songs loaded"
                          : "Latest Ugandan music • Updated from approved songs");
                  content.addView(label(categoryNote,13,muted,false));
                  gap(content,14);
                  songResults = column();
                  content.addView(songResults);
                  loadSongs();
              }

              private void discover() {
                  heading("Discover music","Search by song, artist or genre, then tap a song to listen.");

                  songSearchInput = field("Search songs, artists or genres",InputType.TYPE_CLASS_TEXT);
                  songSearchInput.addTextChangedListener(new TextWatcher() {
                      @Override
                      public void beforeTextChanged(CharSequence s, int start, int count, int after) {}

                      @Override
                      public void onTextChanged(CharSequence s, int start, int before, int count) {
                          renderSongs();
                      }

                      @Override
                      public void afterTextChanged(Editable s) {}
                  });

                  HorizontalScrollView genreScroll = new HorizontalScrollView(this);
                  genreScroll.setHorizontalScrollBarEnabled(false);

                  genreFilterBar = new LinearLayout(this);
                  genreFilterBar.setOrientation(LinearLayout.HORIZONTAL);
                  genreScroll.addView(genreFilterBar);

                  LinearLayout.LayoutParams genreParams =
                      new LinearLayout.LayoutParams(-1,-2);
                  genreParams.bottomMargin = dp(10);
                  content.addView(genreScroll,genreParams);

                  action("Refresh songs",this::loadSongs);

                  songResults = column();
                  content.addView(songResults);
                  loadSongs();
              }

              private void playerScreen() {
                  heading("Music player", "Choose a song below or control your current playback.");
                  if (!audioUrl.isEmpty()) {
                      card(title.isEmpty() ? "Now playing" : title,
                          (artist.isEmpty() ? "NileSoniQ" : artist) +
                          (preparing ? "\nPreparing audio…" : playing ? "\nPlaying now" : "\nPaused"));
                      action(preparing ? "Preparing audio…" : playing ? "Pause playback" : "Play / Resume",
                          this::toggle);
                      action("Stop playback", this::stopPlayback);
                  } else {
                      card("Nothing playing yet", "Select any approved song below to start listening.");
                  }

                  action("Refresh song list", this::loadPlayerSongs);
                  LinearLayout results = column();
                  content.addView(results);
                  results.addView(label("Loading approved songs…", 14, muted, false));
                  loadPlayerSongsInto(results);
              }

              private void loadPlayerSongs() {
                  if (!"Player".equals(tab) || content == null) return;
                  // Rebuild the player tab so the current controls and live catalogue are refreshed.
                  screen("Player");
              }

              private void loadPlayerSongsInto(LinearLayout results) {
                  new Thread(() -> {
                      String raw = getApiText("/api/db/songs?select=id,title,artist,genre,plays,cover_url,audio_url,file_url,created_at,approved&eq.approved=1&order=created_at.desc&limit=100");
                      JSONArray songs = dataArray(raw);
                      runOnUiThread(() -> {
                          try {
                              if (isFinishing() || !"Player".equals(tab) || results.getParent() == null) return;
                              results.removeAllViews();
                              if (songs.length() == 0) {
                                  results.addView(label("No songs could be loaded. Check your connection and tap Refresh song list.", 14, muted, false));
                                  return;
                              }
                              for (int i = 0; i < songs.length(); i++) {
                                  JSONObject song = songs.optJSONObject(i);
                                  if (song == null) continue;
                                  String songTitle = song.optString("title", "Untitled song");
                                  String songArtist = song.optString("artist", "Unknown artist");
                                  LinearLayout row = column();
                                  row.setPadding(dp(13), dp(12), dp(13), dp(12));
                                  row.setBackground(rounded(Color.WHITE, 14, border));
                                  row.addView(label(songTitle, 16, white, true));
                                  gap(row, 4);
                                  row.addView(label(songArtist + " · " + song.optString("genre", "Music"), 12, muted, false));
                                  gap(row, 8);
                                  Button playButton = new Button(this);
                                  playButton.setText("▶  Play song");
                                  playButton.setAllCaps(false);
                                  playButton.setOnClickListener(v -> playSong(song));
                                  row.addView(playButton, new LinearLayout.LayoutParams(-1, dp(44)));
                                  LinearLayout.LayoutParams rowParams = new LinearLayout.LayoutParams(-1, -2);
                                  rowParams.bottomMargin = dp(10);
                                  results.addView(row, rowParams);
                              }
                          } catch (Throwable error) {
                              Log.e("NileSoniQ", "Could not render player song list", error);
                              try {
                                  results.removeAllViews();
                                  results.addView(label("The player list had a display problem. Tap Refresh song list to try again.", 14, muted, false));
                              } catch (Throwable ignored) {}
                          }
                      });
                  }).start();
              }

              private void community() {
                  heading("Community","Discover releases and connect through music.");
                  LinearLayout actions = new LinearLayout(this);
                  actions.setOrientation(LinearLayout.HORIZONTAL);
                  Button refresh = new Button(this);
                  refresh.setText("Refresh"); refresh.setAllCaps(false);
                  refresh.setOnClickListener(v -> screen("Community"));
                  actions.addView(refresh,new LinearLayout.LayoutParams(0,dp(44),1));
                  Button share = new Button(this);
                  share.setText("Share NileSoniQ"); share.setAllCaps(false);
                  share.setOnClickListener(v -> {
                      try {
                          Intent send=new Intent(Intent.ACTION_SEND);
                          send.setType("text/plain");
                          send.putExtra(Intent.EXTRA_TEXT,"Discover Ugandan music on NileSoniQ: https://nilesoniq.com");
                          startActivity(Intent.createChooser(send,"Share NileSoniQ"));
                      } catch(Exception e) { Toast.makeText(this,"Sharing is not available on this device.",Toast.LENGTH_SHORT).show(); }
                  });
                  LinearLayout.LayoutParams shareParams=new LinearLayout.LayoutParams(0,dp(44),1);
                  shareParams.leftMargin=dp(8); actions.addView(share,shareParams);
                  content.addView(actions);
                  gap(content,12);
                  card("Community releases","Latest approved songs from the NileSoniQ catalogue.");
