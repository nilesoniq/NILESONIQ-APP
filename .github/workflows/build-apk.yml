name: Build NileSoniQ Auto Logo
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Build APK
        run: |
          set -x
          ls -lh
          if [ ! -f icon.png ]; then
            echo "icon.png missing - finding image"
            for f in IMG-* *.jpg *.jpeg *.png; do if [ -f "$f" ]; then cp "$f" icon.png; echo "Using $f"; break; fi; done
          fi
          if [ ! -f icon.png ]; then
            python3 -m pip install Pillow -q
            python3 -c "from PIL import Image,ImageDraw; W=1024; img=Image.new('RGB',(W,W),(255,122,0)); d=ImageDraw.Draw(img); d.text((512,430),'N',fill='white',anchor='mm'); img.save('icon.png')"
          fi
          ls -lh icon.png
          rm -rf app build gradle gradlew settings.gradle build.gradle
          mkdir -p app/src/main/java/com/nilesoniq/app
          mkdir -p app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-mdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi app/src/main/res/mipmap-xxxhdpi app/src/main/res/values
          cp icon.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp icon.png app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp icon.png app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp icon.png app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp icon.png app/src/main/res/mipmap-mdpi/ic_launcher.png
          echo 'package com.nilesoniq.app; import android.os.Bundle; import android.webkit.WebView; import android.webkit.WebViewClient; import androidx.appcompat.app.AppCompatActivity; public class MainActivity extends AppCompatActivity { WebView wv; @Override protected void onCreate(Bundle b){ super.onCreate(b); wv=new WebView(this); wv.getSettings().setJavaScriptEnabled(true); wv.getSettings().setDomStorageEnabled(true); wv.setWebViewClient(new WebViewClient()); wv.loadUrl("https://nilesoniq.com"); setContentView(wv); } @Override public void onBackPressed(){ if(wv.canGoBack()) wv.goBack(); else super.onBackPressed(); } }' > app/src/main/java/com/nilesoniq/app/MainActivity.java
          echo '<?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><application android:label="NileSoniQ" android:icon="@mipmap/ic_launcher" android:theme="@android:style/Theme.NoTitleBar"><activity android:name="com.nilesoniq.app.MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml
          echo '<resources><string name="app_name">NileSoniQ</string></resources>' > app/src/main/res/values/strings.xml
          echo 'plugins { id "com.android.application" } android { namespace "com.nilesoniq.app" compileSdk 34 defaultConfig { applicationId "com.nilesoniq.app"; minSdk 21; targetSdk 34; versionCode 29; versionName "5.0-green" } compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 } } dependencies { implementation "androidx.appcompat:appcompat:1.6.1" }' > app/build.gradle
          echo 'buildscript { repositories { google(); mavenCentral() } dependencies { classpath "com.android.tools.build:gradle:8.1.4" } } allprojects { repositories { google(); mavenCentral() } }' > build.gradle
          echo "include ':app'" > settings.gradle
      - name: Build with Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.5
          arguments: assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NileSoniQ-APK-GREEN
          path: app/build/outputs/apk/debug/app-debug.apk
