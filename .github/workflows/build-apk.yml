name: NileSoniQ Auto Logo Native
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK Manually
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wget unzip > /dev/null
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mv cmdline-tools latest
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV

      - name: Generate Logo and Project Fixed
        run: |
          pip install Pillow -q
          python3 << 'PY'
          import os, pathlib, shutil
          os.system("rm -rf app build gradle settings.gradle build.gradle")
          pathlib.Path("app/src/main/java/com/nilesoniq/app").mkdir(parents=True, exist_ok=True)
          pathlib.Path("app/src/main/res/layout").mkdir(parents=True, exist_ok=True)
          pathlib.Path("app/src/main/res/mipmap-xxxhdpi").mkdir(parents=True, exist_ok=True)
          pathlib.Path("app/src/main/res/values").mkdir(parents=True, exist_ok=True)
          from PIL import Image, ImageDraw, ImageFont
          W=1024; img=Image.new('RGB',(W,W),(255,122,0)); d=ImageDraw.Draw(img)
          try: f=ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", 500)
          except: f=ImageFont.load_default()
          d.text((512, 430), "N", fill="white", font=f, anchor="mm")
          try: f2=ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", 70)
          except: f2=ImageFont.load_default()
          d.text((512, 850), "NileSoniQ", fill="white", font=f2, anchor="mm")
          img.save("icon.png"); shutil.copy("icon.png","app/src/main/res/mipmap-xxxhdpi/ic_launcher.png")
          # FIXED THEME - was Theme.Light which crashes on API 34
          open("app/src/main/res/values/strings.xml","w").write('<resources><string name="app_name">NileSoniQ</string></resources>')
          open("app/src/main/AndroidManifest.xml","w").write('<manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><application android:label="NileSoniQ" android:icon="@mipmap/ic_launcher" android:theme="@android:style/Theme.Material.Light.NoActionBar"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity><activity android:name=".ArtistEarningsActivity"/><activity android:name=".UploadActivity"/></application></manifest>')
          open("app/src/main/res/layout/activity_main.xml","w").write('<LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:orientation="vertical" android:layout_width="match_parent" android:layout_height="match_parent"><TextView android:text="NileSoniQ" android:background="#FF7A00" android:textColor="#FFF" android:padding="16dp" android:textSize="20sp" android:textStyle="bold" android:layout_width="match_parent" android:layout_height="wrap_content"/><androidx.recyclerview.widget.RecyclerView android:id="@+id/recycler" android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1"/><LinearLayout android:orientation="horizontal" android:background="#FF7A00" android:layout_width="match_parent" android:layout_height="70dp"><Button android:id="@+id/btnArtist" android:text="Earnings" android:layout_width="0dp" android:layout_weight="1" android:layout_height="wrap_content"/><Button android:id="@+id/btnUpload" android:text="Upload" android:layout_width="0dp" android:layout_weight="1" android:layout_height="wrap_content"/></LinearLayout></LinearLayout>')
          open("app/src/main/res/layout/activity_artist.xml","w").write('<LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:orientation="vertical" android:padding="16dp" android:layout_width="match_parent" android:layout_height="match_parent"><TextView android:text="Artist Earnings: UGX 2,450,000 (124K Plays) Balance UGX 850,000" android:textSize="16sp" android:layout_width="wrap_content" android:layout_height="wrap_content"/><Button android:text="Withdraw via Mobile Money" android:layout_marginTop="24dp" android:layout_width="match_parent" android:layout_height="wrap_content"/></LinearLayout>')
          open("app/src/main/res/layout/activity_upload.xml","w").write('<LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:orientation="vertical" android:padding="16dp" android:layout_width="match_parent" android:layout_height="match_parent"><TextView android:text="Upload Song" android:textSize="20sp" android:textStyle="bold" android:layout_width="wrap_content" android:layout_height="wrap_content"/><EditText android:hint="Song Title" android:layout_marginTop="16dp" android:layout_width="match_parent" android:layout_height="wrap_content"/><EditText android:hint="Artist Name" android:layout_width="match_parent" android:layout_height="wrap_content"/><Button android:text="Upload for Review" android:layout_marginTop="24dp" android:layout_width="match_parent" android:layout_height="wrap_content"/></LinearLayout>')
          # FIXED JAVA - single public class per file
          open("app/src/main/java/com/nilesoniq/app/MainActivity.java","w").write('package com.nilesoniq.app;\nimport android.content.Intent;\nimport android.os.Bundle;\nimport android.view.ViewGroup;\nimport android.widget.TextView;\nimport androidx.appcompat.app.AppCompatActivity;\nimport androidx.recyclerview.widget.LinearLayoutManager;\nimport androidx.recyclerview.widget.RecyclerView;\npublic class MainActivity extends AppCompatActivity{\n  protected void onCreate(Bundle b){\n    super.onCreate(b);\n    setContentView(R.layout.activity_main);\n    RecyclerView rv=findViewById(R.id.recycler);\n    rv.setLayoutManager(new LinearLayoutManager(this));\n    rv.setAdapter(new RecyclerView.Adapter<RecyclerView.ViewHolder>(){\n      String[] s={"Quinamino - Azawi","Sitya Loss - Eddy Kenzo","Dalia - Joshua Baraka"};\n      public RecyclerView.ViewHolder onCreateViewHolder(ViewGroup p,int t){TextView tv=new TextView(p.getContext());tv.setPadding(32,48,32,48);tv.setTextSize(16);return new RecyclerView.ViewHolder(tv){};}\n      public void onBindViewHolder(RecyclerView.ViewHolder h,int i){((TextView)h.itemView).setText(s[i]);}\n      public int getItemCount(){return s.length;}\n    });\n    findViewById(R.id.btnArtist).setOnClickListener(v->startActivity(new Intent(this,ArtistEarningsActivity.class)));\n    findViewById(R.id.btnUpload).setOnClickListener(v->startActivity(new Intent(this,UploadActivity.class)));\n  }\n}')
          open("app/src/main/java/com/nilesoniq/app/ArtistEarningsActivity.java","w").write('package com.nilesoniq.app;import android.os.Bundle;import androidx.appcompat.app.AppCompatActivity;public class ArtistEarningsActivity extends AppCompatActivity{protected void onCreate(Bundle b){super.onCreate(b);setContentView(R.layout.activity_artist);}}')
          open("app/src/main/java/com/nilesoniq/app/UploadActivity.java","w").write('package com.nilesoniq.app;import android.os.Bundle;import androidx.appcompat.app.AppCompatActivity;public class UploadActivity extends AppCompatActivity{protected void onCreate(Bundle b){super.onCreate(b);setContentView(R.layout.activity_upload);}}')
          open("app/build.gradle","w").write("plugins { id 'com.android.application' } android { namespace 'com.nilesoniq.app' compileSdk 34 defaultConfig { applicationId \"com.nilesoniq.app\"; minSdk 21; targetSdk 34; versionCode 37; versionName \"9.0-fixed\" } compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 } } dependencies { implementation 'androidx.appcompat:appcompat:1.6.1'; implementation 'androidx.recyclerview:recyclerview:1.3.2'; }")
          open("build.gradle","w").write("buildscript { repositories { google(); mavenCentral() } dependencies { classpath 'com.android.tools.build:gradle:8.1.4' } } allprojects { repositories { google(); mavenCentral() } }")
          open("settings.gradle","w").write("include ':app'")
          PY

      - name: Build APK
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.5
          arguments: assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NileSoniQ-Native-FINAL
          path: app/build/outputs/apk/debug/app-debug.apk
