              private void artistNotifications(String songSummary, String earnings, JSONArray payouts, JSONArray withdrawals, JSONArray songs) {
                  heading("Notifications","Updates for your artist account.");
                  card("Song review updates",songSummary);
                  StringBuilder tx=new StringBuilder();
                  for(int i=0;i<payouts.length();i++) {
                      JSONObject o=payouts.optJSONObject(i); if(o==null) continue;
                      if(tx.length()>0) tx.append("\\n");
                      tx.append("Payout: UGX ").append(money(o.optDouble("amount",0))).append(" · ").append(o.optString("status","Unknown"));
                  }
                  for(int i=0;i<withdrawals.length();i++) {
                      JSONObject o=withdrawals.optJSONObject(i); if(o==null) continue;
                      if(tx.length()>0) tx.append("\\n");
                      tx.append("Withdrawal: UGX ").append(money(o.optDouble("amount",0))).append(" · ").append(o.optString("status","Unknown"));
                  }
                  card("Wallet notifications",tx.length()==0?"No payout or withdrawal updates were returned.":tx.toString());
                  action("Back to Artist Dashboard",this::artistDashboard);
              }

