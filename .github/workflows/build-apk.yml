name: Build NileSoniQ APK Orange
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Generate Orange Icon Automatically
        run: |
          python3 -m pip install Pillow -q
          python3 << 'PY'
          from PIL import Image, ImageDraw, ImageFont
          # Create 1024x1024 orange gradient icon with N
          img = Image.new('RGB', (1024,1024), '#FF6600')
          draw = ImageDraw.Draw(img)
          # Gradient effect
          for y in range(1024):
              r = int(255 - y*0.15)
              g = int(102 + y*0.05)
              b = 0
              draw.line([(0,y),(1024,y)], fill=(r,g,b))
          # White N
          try:
              font = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", 700)
          except:
              font = ImageFont.load_default()
          draw.text((280, 150), "N", fill="white", font=font)
          img.save("icon.png")
          print("Icon created")
          PY
          ls -lh icon.png

      - name: Create Android Project
        run: |
          mkdir -p app/src/main/java/com/nilesoniq/app
          mkdir -p app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-mdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi app/src/main/res/mipmap-xxxhdpi app/src/main/res/values
          cp icon.png app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp icon.png app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp icon.png app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp icon.png app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp icon.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cat > app/src/main/java/com/nilesoniq/app/MainActivity.java << 'JAVA'
          package com.nilesoniq.app;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          public class MainActivity extends Activity {
            @Override public void onCreate(Bundle b){
              super.onCreate(b);
              WebView wv = new WebView(this);
              WebSettings s = wv.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              wv.setWebViewClient(new WebViewClient());
              wv.loadUrl("https://nilesoniq.com");
              setContentView(wv);
            }
          }
          JAVA
          cat > app/src/main/AndroidManifest.xml << 'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:label="NileSoniQ" android:icon="@mipmap/ic_launcher">
              <activity android:name="com.nilesoniq.app.MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          XML
          echo '<resources><string name="app_name">NileSoniQ</string></resources>' > app/src/main/res/values/strings.xml
          cat > app/build.gradle << 'GRADLE'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.nilesoniq.app'
            compileSdk 34
            defaultConfig {
              applicationId "com.nilesoniq.app"
              minSdk 21
              targetSdk 34
              versionCode 4
              versionName "2.0-orange-auto"
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }
          GRADLE
          cat > build.gradle << 'GRADLE'
          buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.1.4' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          GRADLE
          echo "include ':app'" > settings.gradle

      - name: Build APK
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.5
          arguments: assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: NileSoniQ-Orange-APK
          path: app/build/outputs/apk/debug/app-debug.apk
