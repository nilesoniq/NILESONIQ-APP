name: Build NileSoniQ Auto Logo
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Auto Generate Logo
        run: |
          python3 -m pip install Pillow -q
          python3 << 'PY'
          from PIL import Image, ImageDraw, ImageFont
          W=1024
          img = Image.new('RGB', (W,W), '#FF6A00')
          draw = ImageDraw.Draw(img)
          # orange gradient
          for y in range(W):
              r = int(255 - y*0.12)
              g = int(106 + y*0.08)
              b = 0
              draw.line([(0,y),(W,y)], fill=(max(r,200), max(g,80), b))
          # rounded mask
          mask = Image.new('L', (W,W), 0)
          md = ImageDraw.Draw(mask)
          md.rounded_rectangle([60,60,W-60,W-60], radius=180, fill=255)
          # apply mask
          final = Image.new('RGB', (W,W), '#D97706')
          final.paste(img, mask=mask)
          d = ImageDraw.Draw(final)
          try:
              fN = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", 520)
              fT = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", 68)
          except:
              fN = ImageFont.load_default()
              fT = ImageFont.load_default()
          d.text((W//2, W//2-30), "N", fill="white", font=fN, anchor="mm")
          d.text((W//2, W//2+270), "NileSoniQ", fill="white", font=fT, anchor="mm")
          final.save("icon.png")
          print("OK icon.png created")
          PY
          ls -lh icon.png
      - name: Build APK
        run: |
          mkdir -p app/src/main/java/com/nilesoniq/app
          mkdir -p app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-mdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi app/src/main/res/mipmap-xxxhdpi app/src/main/res/values
          cp icon.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp icon.png app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp icon.png app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp icon.png app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp icon.png app/src/main/res/mipmap-mdpi/ic_launcher.png
          cat > app/src/main/java/com/nilesoniq/app/MainActivity.java << 'JAVA'
          package com.nilesoniq.app;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.appcompat.app.AppCompatActivity;
          public class MainActivity extends AppCompatActivity {
            private WebView wv;
            @Override protected void onCreate(Bundle b){
              super.onCreate(b);
              wv = new WebView(this);
              WebSettings s = wv.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              wv.setWebViewClient(new WebViewClient());
              wv.loadUrl("https://nilesoniq.com");
              setContentView(wv);
            }
            @Override public void onBackPressed(){ if(wv.canGoBack()) wv.goBack(); else super.onBackPressed(); }
          }
          JAVA
          cat > app/src/main/AndroidManifest.xml << 'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:label="NileSoniQ" android:icon="@mipmap/ic_launcher" android:theme="@android:style/Theme.NoTitleBar">
              <activity android:name="com.nilesoniq.app.MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity>
            </application>
          </manifest>
          XML
          echo '<resources><string name="app_name">NileSoniQ</string></resources>' > app/src/main/res/values/strings.xml
          cat > app/build.gradle << 'GRADLE'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.nilesoniq.app'
            compileSdk 34
            defaultConfig {
              applicationId "com.nilesoniq.app"
              minSdk 21
              targetSdk 34
              versionCode 12
              versionName "3.2-auto-logo-fixed"
            }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }
          GRADLE
          cat > build.gradle << 'GRADLE'
          buildscript { repositories { google(); mavenCentral() } dependencies { classpath 'com.android.tools.build:gradle:8.1.4' } }
          allprojects { repositories { google(); mavenCentral() } }
          GRADLE
          echo "include ':app'" > settings.gradle
      - uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.5
          arguments: assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: NileSoniQ-Auto-Logo-APK
          path: app/build/outputs/apk/debug/app-debug.apk
