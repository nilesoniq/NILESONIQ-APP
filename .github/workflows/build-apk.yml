              private void withdrawalScreen() {
                  if (signedInUser == null) { screen("Profile"); return; }
                  content.removeAllViews();
                  heading("Request a withdrawal", "Requests are checked by the NileSoniQ backend. Minimum amount: UGX 10,000.");
                  EditText amountInput = field("Amount in UGX (minimum 10000)", InputType.TYPE_CLASS_NUMBER | InputType.TYPE_NUMBER_FLAG_DECIMAL);
                  EditText methodInput = field("Payment method (e.g. MTN Mobile Money)", InputType.TYPE_CLASS_TEXT);
                  EditText detailsInput = field("Payment details / registered phone number", InputType.TYPE_CLASS_TEXT);
                  card("Important", "Only your available approved-song earnings can be requested. A successful submission creates a pending request; it does not mean payment has already been sent.");
                  action("Submit withdrawal request", () -> {
                      String amountText=amountInput.getText().toString().trim();
                      String method=methodInput.getText().toString().trim();
                      String details=detailsInput.getText().toString().trim();
                      double amount;
                      try { amount=Double.parseDouble(amountText); } catch(Exception e) { amount=0; }
                      if(!Double.isFinite(amount) || amount<10000 || method.isEmpty() || details.isEmpty()) {
                          Toast.makeText(this,"Enter at least UGX 10,000, a payment method and payment details.",Toast.LENGTH_LONG).show();
                          return;
                      }
                      JSONObject payload=new JSONObject();
                      try { payload.put("amount",amount); payload.put("payment_method",method); payload.put("payment_details",details); }
                      catch(Exception ignored) {}
                      actionBusyToast("Submitting withdrawal request…");
                      new Thread(() -> {
                          ApiResult result=request("POST","/api/db/withdrawal_requests",payload);
                          boolean ok=result.code>=200 && result.code<300 && result.body!=null && (!result.body.has("error") || result.body.isNull("error"));
                          String message=ok ? "Withdrawal request submitted. Status: pending." : (result.body==null ? "Withdrawal request failed (HTTP "+result.code+")." : result.body.optString("error","Withdrawal request failed."));
                          runOnUiThread(() -> {
                              if(isFinishing()) return;
                              content.removeAllViews();
                              heading(ok?"Request submitted":"Request not submitted", "Backend response");
                              card(ok?"Pending withdrawal": "Unable to submit", message);
                              action("Back to Artist Dashboard",this::artistDashboard);
                          });
                      }).start();
                  });
                  action("Back to Artist Dashboard",this::artistDashboard);
              }

              private void actionBusyToast(String message) {
                  Toast.makeText(this,message,Toast.LENGTH_SHORT).show();
              }

              private void adminToolsScreen() {
                  if(signedInAdmin==null) {
                      Toast.makeText(this,"Admin access required.",Toast.LENGTH_LONG).show();
                      screen("Profile");
                      return;
                  }
                  boolean superAdmin="super_admin".equalsIgnoreCase(signedInAdmin.optString("role",""));
                  content.removeAllViews();
                  heading("Admin Tools", "Actions are restricted by the authenticated NileSoniQ Worker role.");
                  action("Review pending song submissions",this::adminReviewSongs);
                  if(superAdmin) {
                      action("Copyright removal",this::copyrightRemovalScreen);
                      action("PesaJet collection (platform deposit)",() -> pesajetScreen("collection"));
                      action("PesaJet disbursement (platform payout)",() -> pesajetScreen("disbursement"));
                  }
                  action("Refresh account permissions",this::checkSession);
                  action("Back to Profile",() -> screen("Profile"));
              }

              private void adminReviewSongs() {
                  if(signedInAdmin==null) { screen("Profile"); return; }
                  content.removeAllViews();
                  heading("Song approvals", "Approve or reject pending submissions through the Worker.");
                  card("Loading submissions…", "Fetching pending songs.");
                  new Thread(() -> {
                      JSONArray songs=dataArray(getApiText("/api/admin/songs?status=pending"));
                      runOnUiThread(() -> {
                          if(isFinishing()) return;
                          content.removeAllViews();
                          heading("Song approvals", "Pending submissions: "+songs.length());
                          if(songs.length()==0) card("No pending songs", "There are no pending submissions returned by the backend.");
                          for(int i=0;i<songs.length();i++) {
                              JSONObject song=songs.optJSONObject(i); if(song==null) continue;
                              String id=song.optString("id","");
                              String name=song.optString("title","Untitled song");
                              card(name, "Artist: "+song.optString("artist","Unknown")+"\nStatus: "+song.optString("review_status","pending")+"\nID: "+id);
                              action("Approve: "+name, () -> reviewSong(id,"approved"));
                              action("Reject: "+name, () -> reviewSong(id,"rejected"));
                          }
                          action("Refresh submissions",this::adminReviewSongs);
                          action("Back to Admin Tools",this::adminToolsScreen);
                      });
                  }).start();
              }

              private void reviewSong(String songId, String status) {
                  if(songId==null || songId.isEmpty()) return;
                  JSONObject payload=new JSONObject();
                  try { payload.put("status",status); } catch(Exception ignored) {}
                  new Thread(() -> {
                      ApiResult result=request("POST","/api/admin/songs/"+urlEncode(songId)+"/review",payload);
                      boolean ok=result.code>=200 && result.code<300 && result.body!=null && result.body.optBoolean("success");
                      runOnUiThread(() -> {
                          Toast.makeText(this,ok?"Song marked "+status+".":(result.body==null?"Review failed (HTTP "+result.code+").":result.body.optString("error","Review failed.")),Toast.LENGTH_LONG).show();
                          adminReviewSongs();
                      });
                  }).start();
              }

              private void copyrightRemovalScreen() {
                  if(signedInAdmin==null || !"super_admin".equalsIgnoreCase(signedInAdmin.optString("role",""))) { screen("Profile"); return; }
                  content.removeAllViews();
                  heading("Copyright removal", "Record an audited removal of a song or artist. This action is restricted to Super Admin.");
                  EditText typeInput=field("Content type: song or artist",InputType.TYPE_CLASS_TEXT);
                  EditText idInput=field("Exact song ID or artist profile/user ID",InputType.TYPE_CLASS_TEXT);
                  EditText reasonInput=field("Reason (at least 5 characters)",InputType.TYPE_CLASS_TEXT | InputType.TYPE_TEXT_FLAG_MULTI_LINE);
                  action("Record copyright removal", () -> {
                      String type=typeInput.getText().toString().trim().toLowerCase(Locale.US);
                      String id=idInput.getText().toString().trim();
                      String reason=reasonInput.getText().toString().trim();
                      if(!(type.equals("song")||type.equals("artist")) || id.isEmpty() || reason.length()<5) {
                          Toast.makeText(this,"Choose song or artist, enter its exact ID and a reason of at least 5 characters.",Toast.LENGTH_LONG).show(); return;
                      }
                      JSONObject payload=new JSONObject();
                      try { payload.put("content_type",type); payload.put("content_id",id); payload.put("reason",reason); } catch(Exception ignored) {}
                      new Thread(() -> {
                          ApiResult result=request("POST","/api/admin/copyright-removals",payload);
                          boolean ok=result.code>=200 && result.code<300 && result.body!=null && result.body.optBoolean("success");
                          String msg=ok?"Copyright removal recorded and content restricted by the backend.":(result.body==null?"Request failed (HTTP "+result.code+").":result.body.optString("error","Copyright removal failed."));
                          runOnUiThread(() -> {
                              if(isFinishing()) return;
                              content.removeAllViews(); heading(ok?"Removal recorded":"Removal failed","Worker response"); card(ok?"Success":"Not completed",msg);
                              action("Back to Admin Tools",this::adminToolsScreen);
                          });
                      }).start();
                  });
                  action("Back to Admin Tools",this::adminToolsScreen);
              }

              private void pesajetScreen(String type) {
                  if(signedInAdmin==null || !"super_admin".equalsIgnoreCase(signedInAdmin.optString("role",""))) { screen("Profile"); return; }
                  boolean collection="collection".equals(type);
                  content.removeAllViews();
                  heading(collection?"PesaJet Collection":"PesaJet Disbursement", collection?"Request a platform wallet deposit.":"Request a platform wallet payout.");
                  EditText amountInput=field("Amount in UGX (minimum 1000)",InputType.TYPE_CLASS_NUMBER | InputType.TYPE_NUMBER_FLAG_DECIMAL);
                  EditText phoneInput=field("Ugandan mobile-money phone number",InputType.TYPE_CLASS_PHONE);
                  EditText providerInput=field("Provider: MTN or Airtel",InputType.TYPE_CLASS_TEXT);
                  EditText descriptionInput=field("Description (optional)",InputType.TYPE_CLASS_TEXT);
                  card("Payment safety", "The Worker requires Super Admin access and a configured PesaJet API key. A request may remain pending until the provider webhook confirms its final status. Do not submit the same payment again if the result is uncertain.");
                  action("Submit PesaJet request", () -> {
                      double amount; try { amount=Double.parseDouble(amountInput.getText().toString().trim()); } catch(Exception e) { amount=0; }
                      String phone=phoneInput.getText().toString().trim();
                      String provider=providerInput.getText().toString().trim().toLowerCase(Locale.US);
                      if(!Double.isFinite(amount)||amount<1000||phone.isEmpty()||!(provider.equals("mtn")||provider.equals("airtel"))) {
                          Toast.makeText(this,"Enter an amount of at least UGX 1,000, a phone number, and MTN or Airtel.",Toast.LENGTH_LONG).show(); return;
                      }
                      JSONObject payload=new JSONObject();
                      try { payload.put("amount",amount); payload.put("phone_number",phone); payload.put("provider",provider); payload.put("description",descriptionInput.getText().toString().trim()); } catch(Exception ignored) {}
                      new Thread(() -> {
                          ApiResult result=request("POST",collection?"/api/payments/pesajet-collection":"/api/payments/pesajet-disbursement",payload);
                          boolean ok=result.code>=200&&result.code<300&&result.body!=null&&result.body.optBoolean("success");
                          String msg;
                          if(result.body==null) msg="No valid response (HTTP "+result.code+").";
                          else msg=result.body.optString("message",result.body.optString("error",ok?("Status: "+result.body.optString("status","PENDING")+"\nReference: "+result.body.optString("reference","Not returned")):"Payment request failed."));
                          final String resultMessage=msg;
                          runOnUiThread(() -> {
                              if(isFinishing()) return;
                              content.removeAllViews(); heading(ok?"PesaJet request accepted":"PesaJet request not accepted","Provider status response");
                              card(ok?"Transaction status":"Request error",resultMessage);
                              if(result.body!=null) card("Reference",result.body.optString("reference","Not returned")+"\nTransaction ID: "+result.body.optString("transactionId","Not returned")+"\nStatus: "+result.body.optString("status","Unknown"));
                              action("Back to Admin Tools",this::adminToolsScreen);
                          });
                      }).start();
                  });
                  action("Back to Admin Tools",this::adminToolsScreen);
              }

