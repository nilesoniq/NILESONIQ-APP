name: NileSoniQ Android APK

'on':
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build NileSoniQ APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          packages: platform-tools

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euxo pipefail
          sdkmanager --licenses
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Gradle
        shell: bash
        run: |
          set -euxo pipefail
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          echo "$GITHUB_WORKSPACE/gradle-8.5/bin" >> "$GITHUB_PATH"
          "$GITHUB_WORKSPACE/gradle-8.5/bin/gradle" --version

      - name: Generate Android project
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p app/src/main/java/com/nilesoniq/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = 'NileSoniQ'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.1.4' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.nilesoniq.app'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.nilesoniq.app'
                  minSdk 23
                  targetSdk 34
                  versionCode 6
                  versionName '1.5'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/res/drawable/nilesoniq_logo.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#F47700" android:pathData="M0,0h108v108h-108z" />
              <path android:fillColor="#FFFFFF" android:pathData="M25,80V28h12l34,34V28h12v52H71L37,46v34z" />
          </vector>
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">NileSoniQ</string>
          </resources>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#FF7A00</item>
                  <item name="android:statusBarColor">#FFFFFF</item>
                  <item name="android:navigationBarColor">#FFFFFF</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:windowLightNavigationBar">true</item>
                  <item name="android:windowBackground">#FFFFFF</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:icon="@drawable/nilesoniq_logo"
                  android:usesCleartextTraffic="false"
                  android:theme="@style/AppTheme">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/nilesoniq/app/MainActivity.java <<'EOF'
          package com.nilesoniq.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.media.AudioAttributes;
          import android.media.MediaPlayer;
          import android.content.SharedPreferences;
          import android.net.Uri;
          import android.database.Cursor;
          import android.text.InputType;
          import android.text.Editable;
          import android.text.TextWatcher;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.ImageView;
          import android.widget.EditText;
          import android.widget.HorizontalScrollView;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.util.LinkedHashSet;
          import java.util.Locale;
          import java.util.Set;

          public class MainActivity extends Activity {
              private static final String API = "https://nilesoniq.com";
              private static final String PREFS = "nilesoniq_session";
              private static final String COOKIE_KEY = "session_cookie";

              // NileSoniQ light theme: white surfaces, orange highlights and readable text.
              private final int bg = Color.rgb(248,247,245);
              private final int panel = Color.rgb(255,255,255);
              private final int orange = Color.rgb(244,119,0);
              private final int white = Color.rgb(32,33,42);
              private final int muted = Color.rgb(105,105,105);
              private final int border = Color.rgb(233,231,228);

              private LinearLayout root, content;
              private LinearLayout songResults, genreFilterBar;
              private EditText songSearchInput;
              private JSONArray cachedSongs = new JSONArray();
              private String selectedGenre = "All";
              private int songRequestId = 0;
              private String homeCategory = "New Releases";

              private String tab = "Home";
              private MediaPlayer player;
              private String title = "", artist = "", audioUrl = "";
              private boolean playing = false, preparing = false;
              private int token = 0;
              private JSONObject signedInUser;
              private boolean authBusy = false;
              private String authMode = "login";
              private EditText nameInput, phoneInput, emailInput, passwordInput;
              private EditText uploadTitleInput, uploadArtistInput, uploadGenreInput, uploadDescriptionInput;
              private Uri selectedAudioUri, selectedCoverUri;
              private boolean uploadBusy = false;
              private static final int PICK_AUDIO = 6101;
              private static final int PICK_COVER = 6102;

              @Override
              public void onCreate(Bundle state) {
                  super.onCreate(state);
                  getWindow().setStatusBarColor(Color.WHITE);
                  getWindow().setNavigationBarColor(Color.WHITE);
                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR |
                      View.SYSTEM_UI_FLAG_LIGHT_NAVIGATION_BAR
                  );
                  screen("Home");
                  checkSession();
              }

              private int dp(int n) {
                  return (int)(n * getResources().getDisplayMetrics().density + 0.5f);
              }

              private GradientDrawable rounded(int color, int radiusDp, int strokeColor) {
                  GradientDrawable drawable = new GradientDrawable();
                  drawable.setColor(color);
                  drawable.setCornerRadius(dp(radiusDp));
                  if (strokeColor != Color.TRANSPARENT) {
                      drawable.setStroke(dp(1),strokeColor);
                  }
                  return drawable;
              }

              private TextView label(String s, int size, int color, boolean bold) {
                  TextView v = new TextView(this);
                  v.setText(s);
                  v.setTextSize(size);
                  v.setTextColor(color);
                  if (bold) v.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
                  return v;
              }

              private LinearLayout column() {
                  LinearLayout l = new LinearLayout(this);
                  l.setOrientation(LinearLayout.VERTICAL);
                  return l;
              }

              private void gap(LinearLayout l, int height) {
                  l.addView(new View(this), new LinearLayout.LayoutParams(1, dp(height)));
              }

              private void screen(String name) {
                  // Invalidate outstanding song requests whenever a screen is rebuilt.
                  // This prevents older network responses from writing into a new screen.
                  songRequestId++;
                  songResults = null;
                  genreFilterBar = null;
                  songSearchInput = null;

                  tab = name;
                  root = column();
                  root.setBackgroundColor(bg);
                  root.setPadding(dp(18),dp(14),dp(18),dp(8));

                  LinearLayout header = new LinearLayout(this);
                  header.setGravity(Gravity.CENTER_VERTICAL);
                  LinearLayout brand = column();
                  brand.setGravity(Gravity.CENTER_VERTICAL);
                  LinearLayout mark = new LinearLayout(this);
                  mark.setGravity(Gravity.CENTER);
                  mark.setBackground(rounded(orange,14,orange));
                  TextView bigN = label("N",30,Color.WHITE,true);
                  bigN.setGravity(Gravity.CENTER);
                  mark.addView(bigN,new LinearLayout.LayoutParams(dp(48),dp(48)));
                  brand.addView(mark);
                  TextView wordmark = label("NileSoniQ",16,orange,true);
                  wordmark.setGravity(Gravity.CENTER);
                  brand.addView(wordmark);
                  header.addView(brand,new LinearLayout.LayoutParams(-2,-2,1));
                  TextView tagline = label("MUSIC • COMMUNITY",10,muted,true);
                  tagline.setGravity(Gravity.CENTER_VERTICAL | Gravity.RIGHT);
                  header.addView(tagline);
                  root.addView(header);
                  gap(root,18);

                  ScrollView scroll = new ScrollView(this);
                  content = column();
                  content.setPadding(0,0,0,dp(16));
                  scroll.addView(content);
                  root.addView(scroll,new LinearLayout.LayoutParams(-1,0,1));

                  LinearLayout nav = new LinearLayout(this);
                  nav.setGravity(Gravity.CENTER);
                  nav.setBackground(rounded(Color.WHITE,16,border));
                  nav.setElevation(dp(3));
                  String[] names = {"Home","Discover","Player","Community","Profile"};
                  for (String n : names) {
                      TextView item = label(n,10,n.equals(tab)?orange:muted,true);
                      item.setGravity(Gravity.CENTER);
                      item.setPadding(dp(2),dp(12),dp(2),dp(12));
                      item.setOnClickListener(v -> screen(n));
                      nav.addView(item,new LinearLayout.LayoutParams(0,-2,1));
                  }
                  LinearLayout.LayoutParams navParams =
                      new LinearLayout.LayoutParams(-1,-2);
                  navParams.topMargin = dp(8);
                  root.addView(nav,navParams);
                  setContentView(root);

                  if (name.equals("Home")) home();
                  else if (name.equals("Discover")) discover();
                  else if (name.equals("Player")) playerScreen();
                  else if (name.equals("Community")) community();
                  else profile();
              }

              private void heading(String h, String sub) {
                  content.addView(label(h,25,white,true));
                  gap(content,6);
                  content.addView(label(sub,14,muted,false));
                  gap(content,18);
              }

              private void card(String h, String sub) {
                  LinearLayout box = column();
                  box.setBackground(rounded(Color.WHITE,16,border));
                  box.setElevation(dp(2));
                  box.setPadding(dp(15),dp(14),dp(15),dp(14));
                  box.addView(label(h,17,white,true));
                  gap(box,7);
                  box.addView(label(sub,13,muted,false));
                  LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(-1,-2);
                  p.bottomMargin = dp(12);
                  content.addView(box,p);
              }

              private void action(String name, Runnable run) {
                  Button b = new Button(this);
                  b.setText(name);
                  b.setAllCaps(false);
                  b.setTextColor(Color.WHITE);
                  b.setBackgroundTintList(android.content.res.ColorStateList.valueOf(orange));
                  b.setOnClickListener(v -> run.run());
                  LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(-1,dp(48));
                  p.bottomMargin = dp(10);
                  content.addView(b,p);
              }

              private EditText field(String hint, int type) {
                  EditText e = new EditText(this);
                  e.setSingleLine(true);
                  e.setTextColor(white);
                  e.setHintTextColor(muted);
                  e.setHint(hint);
                  e.setTextSize(15);
                  e.setInputType(type);
                  e.setPadding(dp(12),dp(8),dp(12),dp(8));
                  e.setBackground(rounded(Color.WHITE,12,border));
                  LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(-1,dp(52));
                  p.bottomMargin = dp(10);
                  content.addView(e,p);
                  return e;
              }

              private void home() {
                  // Refreshed discovery home: warm background, orange brand accents,
                  // rounded search and song cards. Existing song API and playback remain unchanged.
                  heading("Discover your sound", "Fresh music, rising artists and sounds from across the community.");

                  LinearLayout hero = column();
                  hero.setPadding(dp(18),dp(18),dp(18),dp(18));
                  GradientDrawable heroBg = new GradientDrawable(
                      GradientDrawable.Orientation.TL_BR,
                      new int[]{Color.rgb(255,239,222),Color.rgb(255,220,185)});
                  heroBg.setCornerRadius(dp(22));
                  hero.setBackground(heroBg);
                  hero.addView(label("YOUR NEXT FAVOURITE",11,orange,true));
                  gap(hero,8);
                  hero.addView(label("Feel the rhythm.",25,white,true));
                  gap(hero,5);
                  hero.addView(label("Discover music made to move you.",14,muted,false));
                  gap(hero,14);
                  Button explore = new Button(this);
                  explore.setText("Explore all music  →");
                  explore.setAllCaps(false);
                  explore.setTextColor(Color.WHITE);
                  explore.setBackgroundTintList(android.content.res.ColorStateList.valueOf(orange));
                  explore.setOnClickListener(v -> screen("Discover"));
                  hero.addView(explore,new LinearLayout.LayoutParams(-1,dp(48)));
                  LinearLayout.LayoutParams heroParams = new LinearLayout.LayoutParams(-1,-2);
                  heroParams.bottomMargin = dp(18);
                  content.addView(hero,heroParams);

                  content.addView(label("Find your sound",19,white,true));
                  gap(content,8);
                  songSearchInput = field("Search songs, artists or genres",InputType.TYPE_CLASS_TEXT);
                  songSearchInput.addTextChangedListener(new TextWatcher() {
                      @Override public void beforeTextChanged(CharSequence s, int start, int count, int after) {}
                      @Override public void onTextChanged(CharSequence s, int start, int before, int count) {
                          renderSongs();
                      }
                      @Override public void afterTextChanged(Editable s) {}
                  });

                  LinearLayout categories = new LinearLayout(this);
                  categories.setOrientation(LinearLayout.HORIZONTAL);
                  categories.setGravity(Gravity.CENTER_VERTICAL);
                  String[] categoryNames = {"New Releases", "Top Charts", "Trending"};
                  for (String category : categoryNames) {
                      boolean selected = category.equals(homeCategory);
                      TextView chip = label(category,12,selected?Color.WHITE:muted,true);
                      chip.setGravity(Gravity.CENTER);
                      chip.setPadding(dp(12),dp(10),dp(12),dp(10));
                      chip.setBackground(rounded(selected?orange:Color.WHITE,22,
                          selected?orange:border));
                      LinearLayout.LayoutParams cp = new LinearLayout.LayoutParams(-2,-2);
                      cp.rightMargin = dp(7);
                      categories.addView(chip,cp);
                      chip.setOnClickListener(v -> {
                          homeCategory = category;
                          home();
                      });
                  }
                  LinearLayout.LayoutParams categoryParams = new LinearLayout.LayoutParams(-1,-2);
                  categoryParams.bottomMargin = dp(18);
                  content.addView(categories,categoryParams);

                  LinearLayout section = new LinearLayout(this);
                  section.setGravity(Gravity.CENTER_VERTICAL);
                  String sectionTitle = "Top Charts".equals(homeCategory) ? "Top chart songs" :
                      ("Trending".equals(homeCategory) ? "Trending songs" : "Latest approved songs");
                  section.addView(label(sectionTitle,18,white,true),
                      new LinearLayout.LayoutParams(0,-2,1));
                  TextView seeAll = label("See all  →",13,orange,true);
                  seeAll.setOnClickListener(v -> screen("Discover"));
                  section.addView(seeAll);
                  content.addView(section);
                  gap(content,12);

                  // The current API, approved-song filter and audio playback are preserved.
                  songResults = column();
                  content.addView(songResults);
                  loadSongs();
              }

              private void discover() {
                  heading("Discover music","Search by song, artist or genre, then tap a song to listen.");

                  songSearchInput = field("Search songs, artists or genres",InputType.TYPE_CLASS_TEXT);
                  songSearchInput.addTextChangedListener(new TextWatcher() {
                      @Override
                      public void beforeTextChanged(CharSequence s, int start, int count, int after) {}

                      @Override
                      public void onTextChanged(CharSequence s, int start, int before, int count) {
                          renderSongs();
                      }

                      @Override
                      public void afterTextChanged(Editable s) {}
                  });

                  HorizontalScrollView genreScroll = new HorizontalScrollView(this);
                  genreScroll.setHorizontalScrollBarEnabled(false);

                  genreFilterBar = new LinearLayout(this);
                  genreFilterBar.setOrientation(LinearLayout.HORIZONTAL);
                  genreScroll.addView(genreFilterBar);

                  LinearLayout.LayoutParams genreParams =
                      new LinearLayout.LayoutParams(-1,-2);
                  genreParams.bottomMargin = dp(10);
                  content.addView(genreScroll,genreParams);

                  action("Refresh songs",this::loadSongs);

                  songResults = column();
                  content.addView(songResults);
                  loadSongs();
              }

              private void playerScreen() {
                  heading("Music player","Listen to songs from NileSoniQ.");
                  if (audioUrl.isEmpty()) {
                      card("Nothing playing yet","Open Discover and tap a song to start playback.");
                  } else {
                      card(title,artist + (preparing ? "\nPreparing audio…" :
                          playing ? "\nPlaying now" : "\nPaused"));
                      action(preparing ? "Preparing…" : playing ? "Pause" : "Play / Resume",
                          this::toggle);
                      action("Stop playback",this::stopPlayback);
                  }
                  action("Browse songs",() -> screen("Discover"));
              }

              private void community() {
                  heading("Community","Connect through music.");
                  card("Artist posts","Music news, releases, achievements and updates.");
                  card("Artist chat","Community messaging will be available in a future update.");
              }

              private void profile() {
                  heading("Your account","Use your existing NileSoniQ website account.");
                  if (signedInUser != null) {
                      String email = signedInUser.optString("email","Account");
                      String artistName = signedInUser.optString("artist_name","");
                      card("Signed in",email + (artistName.isEmpty() ? "" : "\n"+artistName));
                      action("Open Artist Dashboard",this::artistDashboard);
                      action("Refresh account session",this::checkSession);
                      action("Log out",this::logout);
                      card("Artist studio","Review your song submissions, recorded plays, wallet balance and withdrawal history, and upload songs directly in the app.");
                  } else {
                      card("Sign in or create an account",
                          "Use the same email and password you use on nilesoniq.com.");
                      action(authMode.equals("login") ? "Don't have an account? Sign up" : "Already have an account? Sign in",
                          () -> {
                              authMode = authMode.equals("login") ? "register" : "login";
                              profile();
                          });
                      if (authMode.equals("register")) {
                          nameInput = field("Artist or display name",InputType.TYPE_CLASS_TEXT | InputType.TYPE_TEXT_FLAG_CAP_WORDS);
                          phoneInput = field("Phone number (optional)",InputType.TYPE_CLASS_PHONE);
                      } else {
                          nameInput = null;
                          phoneInput = null;
                      }
                      emailInput = field("Email address",InputType.TYPE_CLASS_TEXT | InputType.TYPE_TEXT_VARIATION_EMAIL_ADDRESS);
                      passwordInput = field("Password (minimum 6 characters)",InputType.TYPE_CLASS_TEXT | InputType.TYPE_TEXT_VARIATION_PASSWORD);
                      action(authBusy ? "Please wait…" : authMode.equals("login") ? "Sign in" : "Create account",
                          this::submitAuth);
                  }
              }

              private void submitAuth() {
                  if (authBusy) return;
                  String email = emailInput == null ? "" : emailInput.getText().toString().trim();
                  String password = passwordInput == null ? "" : passwordInput.getText().toString();
                  String displayName = nameInput == null ? "" : nameInput.getText().toString().trim();
                  String phone = phoneInput == null ? "" : phoneInput.getText().toString().trim();

                  if (email.isEmpty() || password.isEmpty()) {
                      Toast.makeText(this,"Enter your email and password.",Toast.LENGTH_LONG).show();
                      return;
                  }
                  if (authMode.equals("register") && password.length() < 6) {
                      Toast.makeText(this,"Password must be at least 6 characters.",Toast.LENGTH_LONG).show();
                      return;
                  }

                  authBusy = true;
                  profile();
                  new Thread(() -> {
                      JSONObject payload = new JSONObject();
                      try {
                          payload.put("email",email);
                          payload.put("password",password);
                          if (authMode.equals("register")) {
                              payload.put("name",displayName);
                              payload.put("artist_name",displayName);
                              payload.put("phone",phone);
                          }
                          String endpoint = authMode.equals("register")
                              ? "/api/auth/register" : "/api/auth/login";
                          ApiResult result = request("POST",endpoint,payload);
                          JSONObject response = result.body;
                          if (result.cookie != null && !result.cookie.isEmpty()) {
                              saveCookie(result.cookie);
                          }
                          if (result.code >= 200 && result.code < 300 &&
                              response != null && response.optBoolean("success")) {
                              JSONObject user = response.optJSONObject("user");
                              runOnUiThread(() -> {
                                  authBusy = false;
                                  signedInUser = user == null ? new JSONObject() : user;
                                  authMode = "login";
                                  screen("Profile");
                                  Toast.makeText(this,"Account connected successfully.",Toast.LENGTH_LONG).show();
                              });
                          } else {
                              String message = response == null
                                  ? "Unable to connect. Please try again."
                                  : response.optString("error","Sign-in failed. Check your details.");
                              runOnUiThread(() -> {
                                  authBusy = false;
                                  if (!isFinishing()) {
                                      screen("Profile");
                                      Toast.makeText(this,message,Toast.LENGTH_LONG).show();
                                  }
                              });
                          }
                      } catch (Exception e) {
                          runOnUiThread(() -> {
                              authBusy = false;
                              if (!isFinishing()) {
                                  screen("Profile");
                                  Toast.makeText(this,"Connection failed. Check your internet and try again.",Toast.LENGTH_LONG).show();
                              }
                          });
                      }
                  }).start();
              }

              private void checkSession() {
                  new Thread(() -> {
                      ApiResult result = request("GET","/api/auth/me",null);
                      JSONObject response = result.body;
                      JSONObject user = response == null ? null : response.optJSONObject("user");
                      boolean authenticated = response != null && response.optBoolean("authenticated") && user != null;
                      runOnUiThread(() -> {
                          if (isFinishing()) return;
                          if (authenticated) {
                              signedInUser = user;
                          } else {
                              signedInUser = null;
                              if (response != null && !response.optBoolean("authenticated")) {
                                  clearCookie();
                              }
                          }
                          if (tab.equals("Profile")) screen("Profile");
                      });
                  }).start();
              }

              private void logout() {
                  if (authBusy) return;
                  authBusy = true;
                  new Thread(() -> {
                      request("POST","/api/auth/logout",new JSONObject());
                      clearCookie();
                      runOnUiThread(() -> {
                          authBusy = false;
                          signedInUser = null;
                          authMode = "login";
                          screen("Profile");
                          Toast.makeText(this,"You have been logged out.",Toast.LENGTH_SHORT).show();
                      });
                  }).start();
              }

              private String profileImageUrl() {
                  if (signedInUser == null) return "";
                  String[] keys = {"avatar_url","profile_picture_url","profile_image_url","photo_url","avatar","picture","image_url"};
                  for (String key : keys) {
                      String value = signedInUser.optString(key, "").trim();
                      if (value.startsWith("https://") || value.startsWith("http://")) return value;
                  }
                  return "";
              }

              private void addArtistProfile(String artistName, String email) {
                  LinearLayout box = new LinearLayout(this);
                  box.setGravity(Gravity.CENTER_VERTICAL);
                  box.setBackground(rounded(Color.WHITE,18,border));
                  box.setPadding(dp(15),dp(15),dp(15),dp(15));
                  ImageView avatar = new ImageView(this);
                  avatar.setImageDrawable(null);
                  avatar.setBackground(rounded(Color.rgb(255,224,194),40,Color.TRANSPARENT));
                  avatar.setScaleType(ImageView.ScaleType.CENTER_CROP);
                  TextView initial = label(artistName.isEmpty()?"N":artistName.substring(0,1).toUpperCase(Locale.ROOT),25,orange,true);
                  initial.setGravity(Gravity.CENTER);
                  LinearLayout avatarWrap = new LinearLayout(this);
                  avatarWrap.setGravity(Gravity.CENTER);
                  avatarWrap.setBackground(rounded(Color.rgb(255,224,194),40,Color.TRANSPARENT));
                  avatarWrap.addView(initial,new LinearLayout.LayoutParams(dp(64),dp(64)));
                  box.addView(avatarWrap,new LinearLayout.LayoutParams(dp(64),dp(64)));
                  LinearLayout details = column();
