name: NileSoniQ Auto Logo Native
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Generate Logo and Project
        run: |
          pip install Pillow -q
          python3 gen.py
        # gen.py will be created in next step
      - name: Create gen.py file
        run: |
          cat > gen.py << 'PYEND'
          import os, pathlib, shutil
          print("Cleaning")
          os.system("rm -rf app build gradle settings.gradle build.gradle")
          pathlib.Path("app/src/main/java/com/nilesoniq/app").mkdir(parents=True, exist_ok=True)
          pathlib.Path("app/src/main/res/layout").mkdir(parents=True, exist_ok=True)
          pathlib.Path("app/src/main/res/mipmap-xxxhdpi").mkdir(parents=True, exist_ok=True)
          pathlib.Path("app/src/main/res/values").mkdir(parents=True, exist_ok=True)
          from PIL import Image, ImageDraw, ImageFont
          W=1024
          img=Image.new('RGB',(W,W),(255,122,0))
          d=ImageDraw.Draw(img)
          try:
            f=ImageFont.truetype("DejaVuSans-Bold.ttf", 500)
          except:
            f=ImageFont.load_default()
          d.text((512, 440), "N", fill="white", font=f, anchor="mm")
          try:
            f2=ImageFont.truetype("DejaVuSans-Bold.ttf", 70)
          except:
            f2=ImageFont.load_default()
          d.text((512, 850), "NileSoniQ", fill="white", font=f2, anchor="mm")
          img.save("icon.png")
          shutil.copy("icon.png","app/src/main/res/mipmap-xxxhdpi/ic_launcher.png")
          open("app/src/main/res/values/strings.xml","w").write('<resources><string name="app_name">NileSoniQ</string></resources>')
          open("app/src/main/AndroidManifest.xml","w").write('<manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><application android:label="NileSoniQ" android:icon="@mipmap/ic_launcher" android:theme="@android:style/Theme.Light"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity><activity android:name=".ArtistEarningsActivity"/><activity android:name=".UploadActivity"/></application></manifest>')
          open("app/src/main/res/layout/activity_main.xml","w").write('<LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:orientation="vertical" android:layout_width="match_parent" android:layout_height="match_parent"><TextView android:text="NileSoniQ" android:background="#FF7A00" android:textColor="#FFF" android:padding="16dp" android:textSize="20sp" android:textStyle="bold" android:layout_width="match_parent" android:layout_height="wrap_content"/><androidx.recyclerview.widget.RecyclerView android:id="@+id/recycler" android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1"/><LinearLayout android:orientation="horizontal" android:background="#FF7A00" android:layout_width="match_parent" android:layout_height="70dp"><Button android:id="@+id/btnArtist" android:text="Earnings" android:layout_width="0dp" android:layout_weight="1" android:layout_height="wrap_content"/><Button android:id="@+id/btnUpload" android:text="Upload" android:layout_width="0dp" android:layout_weight="1" android:layout_height="wrap_content"/></LinearLayout></LinearLayout>')
          open("app/src/main/res/layout/activity_artist.xml","w").write('<ScrollView xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent"><LinearLayout android:orientation="vertical" android:padding="16dp" android:layout_width="match_parent" android:layout_height="wrap_content"><TextView android:text="Artist Earnings UGX 2,450,000 - 124K Plays" android:textSize="18sp" android:layout_width="wrap_content" android:layout_height="wrap_content"/><Button android:text="Withdraw" android:layout_marginTop="24dp" android:layout_width="match_parent" android:layout_height="wrap_content"/></LinearLayout></ScrollView>')
          open("app/src/main/res/layout/activity_upload.xml","w").write('<ScrollView xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent"><LinearLayout android:orientation="vertical" android:padding="16dp" android:layout_width="match_parent" android:layout_height="wrap_content"><TextView android:text="Upload Song" android:textSize="22sp" android:layout_width="wrap_content" android:layout_height="wrap_content"/><EditText android:hint="Title" android:layout_width="match_parent" android:layout_height="wrap_content"/><Button android:text="Upload for Review" android:layout_marginTop="16dp" android:layout_width="match_parent" android:layout_height="wrap_content"/></LinearLayout></ScrollView>')
          open("app/src/main/java/com/nilesoniq/app/MainActivity.java","w").write('package com.nilesoniq.app;import android.content.Intent;import android.os.Bundle;import androidx.appcompat.app.AppCompatActivity;import androidx.recyclerview.widget.LinearLayoutManager;import androidx.recyclerview.widget.RecyclerView;public class MainActivity extends AppCompatActivity{protected void onCreate(Bundle b){super.onCreate(b);setContentView(R.layout.activity_main);RecyclerView rv=findViewById(R.id.recycler);rv.setLayoutManager(new LinearLayoutManager(this));rv.setAdapter(new SongAdapter());findViewById(R.id.btnArtist).setOnClickListener(v->startActivity(new Intent(this,ArtistEarningsActivity.class)));findViewById(R.id.btnUpload).setOnClickListener(v->startActivity(new Intent(this,UploadActivity.class)));}}class SongAdapter extends RecyclerView.Adapter<SongAdapter.VH>{String[] s={"Quinamino - Azawi","Sitya Loss - Eddy Kenzo"};public VH onCreateViewHolder(android.view.ViewGroup p,int t){android.widget.TextView tv=new android.widget.TextView(p.getContext());tv.setPadding(32,48,32,48);return new VH(tv);}public void onBindViewHolder(VH h,int i){((android.widget.TextView)h.itemView).setText(s[i]);}public int getItemCount(){return s.length;}class VH extends RecyclerView.ViewHolder{VH(android.view.View v){super(v);}}}')
          open("app/src/main/java/com/nilesoniq/app/ArtistEarningsActivity.java","w").write('package com.nilesoniq.app;import android.os.Bundle;import androidx.appcompat.app.AppCompatActivity;public class ArtistEarningsActivity extends AppCompatActivity{protected void onCreate(Bundle b){super.onCreate(b);setContentView(R.layout.activity_artist);}}')
          open("app/src/main/java/com/nilesoniq/app/UploadActivity.java","w").write('package com.nilesoniq.app;import android.os.Bundle;import androidx.appcompat.app.AppCompatActivity;public class UploadActivity extends AppCompatActivity{protected void onCreate(Bundle b){super.onCreate(b);setContentView(R.layout.activity_upload);}}')
          open("app/build.gradle","w").write("plugins { id 'com.android.application' } android { namespace 'com.nilesoniq.app' compileSdk 34 defaultConfig { applicationId \"com.nilesoniq.app\"; minSdk 21; targetSdk 34; versionCode 34; versionName \"7.2\" } compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 } } dependencies { implementation 'androidx.appcompat:appcompat:1.6.1'; implementation 'androidx.recyclerview:recyclerview:1.3.2'; }")
          open("build.gradle","w").write("buildscript { repositories { google(); mavenCentral() } dependencies { classpath 'com.android.tools.build:gradle:8.1.4' } } allprojects { repositories { google(); mavenCentral() } }")
          open("settings.gradle","w").write("include ':app'")
          print("Done")
          PYEND
          ls -lh
      - name: Build APK
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.5
          arguments: assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NileSoniQ-Native-Fixed
          path: app/build/outputs/apk/debug/app-debug.apk
