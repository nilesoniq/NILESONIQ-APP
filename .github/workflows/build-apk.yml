              private void pickFile(int requestCode) {
                  try {
                      android.content.Intent intent = new android.content.Intent(android.content.Intent.ACTION_OPEN_DOCUMENT);
                      intent.addCategory(android.content.Intent.CATEGORY_OPENABLE);
                      intent.setType(requestCode == PICK_AUDIO ? "audio/*" : "image/*");
                      startActivityForResult(intent,requestCode);
                  } catch (Exception e) {
                      Toast.makeText(this,"Could not open the file picker.",Toast.LENGTH_LONG).show();
                  }
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, android.content.Intent data) {
                  super.onActivityResult(requestCode,resultCode,data);
                  if (resultCode != RESULT_OK || data == null || data.getData() == null) return;
                  Uri uri = data.getData();
                  try { getContentResolver().takePersistableUriPermission(uri, data.getFlags() & (android.content.Intent.FLAG_GRANT_READ_URI_PERMISSION)); }
                  catch (Exception ignored) {}
                  if (requestCode == PICK_AVATAR) {
                      selectedAvatarUri = uri;
                      editArtistProfile();
                      return;
                  }
                  if (requestCode == PICK_AUDIO) selectedAudioUri = uri;
                  else if (requestCode == PICK_COVER) selectedCoverUri = uri;
                  if (tab.equals("Profile")) songUploadScreen();
              }

              private String getDisplayName(Uri uri) {
                  if (uri == null) return "Not selected";
                  String name = null;
                  Cursor cursor = null;
                  try {
                      cursor = getContentResolver().query(uri,null,null,null,null);
                      if (cursor != null && cursor.moveToFirst()) {
                          int index = cursor.getColumnIndex(android.provider.OpenableColumns.DISPLAY_NAME);
                          if (index >= 0) name = cursor.getString(index);
                      }
                  } catch (Exception ignored) {} finally { if (cursor != null) cursor.close(); }
                  return name == null || name.trim().isEmpty() ? uri.getLastPathSegment() : name;
              }

              private String safeFileName(String original, String fallback) {
                  String name = original == null ? fallback : original;
                  name = name.replaceAll("[^A-Za-z0-9._-]", "_");
                  if (name.length() > 100) name = name.substring(name.length()-100);
                  return name.isEmpty() ? fallback : name;
              }

              private String uploadObject(Uri uri, String bucket, String userId, String fallback) throws Exception {
                  if (uri == null) return "";
                  String name = safeFileName(getDisplayName(uri),fallback);
                  String objectPath = userId + "/" + System.currentTimeMillis() + "_" + name;
                  java.net.URL url = new URL(API + "/api/storage/upload?bucket=" + bucket + "&path=" + urlEncode(objectPath));
                  HttpURLConnection c = (HttpURLConnection)url.openConnection();
                  try {
                      c.setRequestMethod("POST");
                      c.setConnectTimeout(20000);
                      c.setReadTimeout(120000);
                      c.setDoOutput(true);
                      c.setRequestProperty("Accept","application/json");
                      c.setRequestProperty("Content-Type",getContentResolver().getType(uri) == null ? "application/octet-stream" : getContentResolver().getType(uri));
                      String cookie = getCookie();
                      if (!cookie.isEmpty()) c.setRequestProperty("Cookie",cookie);
                      try (java.io.InputStream in = getContentResolver().openInputStream(uri); OutputStream out = c.getOutputStream()) {
                          if (in == null) throw new Exception("Could not read selected file.");
                          byte[] buffer = new byte[32768];
                          int n;
                          long total = 0;
                          while ((n = in.read(buffer)) != -1) {
                              total += n;
                              if (total > 150L * 1024L * 1024L) throw new Exception("File is larger than 150 MB. Please choose a smaller file.");
                              out.write(buffer,0,n);
                          }
                      }
                      int code = c.getResponseCode();
                      java.io.InputStream stream = code >= 200 && code < 300 ? c.getInputStream() : c.getErrorStream();
                      StringBuilder response = new StringBuilder();
                      if (stream != null) {
                          BufferedReader reader = new BufferedReader(new InputStreamReader(stream,"UTF-8"));
                          String line; while ((line = reader.readLine()) != null) response.append(line);
                          reader.close();
                      }
                      if (code < 200 || code >= 300) {
                          JSONObject err;
                          try { err = new JSONObject(response.toString()); } catch (Exception e) { err = new JSONObject(); }
                          throw new Exception(err.optString("error","File upload failed (HTTP " + code + ")."));
                      }
                      return API + "/api/storage/public/" + bucket + "/" + objectPath;
                  } finally { c.disconnect(); }
              }

              private void submitSongUpload() {
                  if (uploadBusy) return;
                  if (signedInUser == null) {
                      Toast.makeText(this,"Please sign in first.",Toast.LENGTH_LONG).show();
                      return;
                  }
                  String songTitle = uploadTitleInput == null ? "" : uploadTitleInput.getText().toString().trim();
                  String songArtist = uploadArtistInput == null ? "" : uploadArtistInput.getText().toString().trim();
                  String genre = uploadGenreInput == null ? "" : uploadGenreInput.getText().toString().trim();
                  String description = uploadDescriptionInput == null ? "" : uploadDescriptionInput.getText().toString().trim();
                  boolean rightsAccepted = uploadRightsCheckbox != null && uploadRightsCheckbox.isChecked();
                  if (songTitle.isEmpty() || songArtist.isEmpty() || selectedAudioUri == null) {
                      Toast.makeText(this,"Enter the song title and artist, then choose an audio file.",Toast.LENGTH_LONG).show();
                      return;
                  }
                  if (!rightsAccepted) {
                      Toast.makeText(this,"Please confirm that you own or are authorized to upload this music.",Toast.LENGTH_LONG).show();
                      return;
                  }
                  uploadBusy = true;
                  songUploadScreen();
                  new Thread(() -> {
                      try {
                          String userId = signedInUser.optString("id",signedInUser.optString("user_id",""));
                          if (userId.isEmpty()) throw new Exception("Your account ID could not be found. Please sign in again.");
                          String audioUrl = uploadObject(selectedAudioUri,"audio",userId,"song_audio");
                          String coverUrl = selectedCoverUri == null ? "" : uploadObject(selectedCoverUri,"covers",userId,"song_cover");
                          JSONObject row = new JSONObject();
                          row.put("title",songTitle);
                          row.put("artist",songArtist);
                          row.put("artist_id",userId);
                          row.put("audio_url",audioUrl);
                          row.put("file_url",audioUrl);
                          if (!coverUrl.isEmpty()) row.put("cover_url",coverUrl);
                          if (!genre.isEmpty()) row.put("genre",genre);
                          if (!description.isEmpty()) row.put("description",description);
                          row.put("terms_accepted",rightsAccepted);
                          // New uploads must remain private until an authorized admin approves them.
                          row.put("approved",false);
                          row.put("review_status","pending");
                          ApiResult result = request("POST","/api/db/songs",row);
                          // Cloudflare Worker returns data as a single JSON object for one inserted song,
                          // not necessarily an array. Accept either response shape.
                          Object savedData = result.body == null ? null : result.body.opt("data");
                          boolean hasSavedData = savedData != null && savedData != JSONObject.NULL;
                          if (result.code < 200 || result.code >= 300 || !hasSavedData) {
                              String error = result.body == null
                                  ? (result.code == -1 ? "Could not connect to the NileSoniQ Cloudflare API. Check your internet and try again." : "Cloudflare did not return a valid response (HTTP " + result.code + ").")
                                  : result.body.optString("error","Song details could not be saved by the Cloudflare database.");
                              throw new Exception(error);
                          }
                          runOnUiThread(() -> {
                              uploadBusy = false;
                              selectedAudioUri = null;
                              selectedCoverUri = null;
                              Toast.makeText(this,"Song uploaded successfully and sent for admin review.",Toast.LENGTH_LONG).show();
                              artistDashboard();
                          });
                      } catch (Exception e) {
                          String message = e.getMessage() == null ? "Upload failed. Please try again." : e.getMessage();
                          runOnUiThread(() -> {
                              uploadBusy = false;
                              if (!isFinishing()) {
                                  songUploadScreen();
                                  Toast.makeText(this,message,Toast.LENGTH_LONG).show();
                              }
                          });
                      }
                  }).start();
              }

              private String getApiText(String path) {
                  HttpURLConnection c=null;
                  try {
                      c=(HttpURLConnection)new URL(API+path).openConnection();
                      c.setRequestMethod("GET"); c.setConnectTimeout(12000); c.setReadTimeout(12000);
                      c.setRequestProperty("Accept","application/json");
                      String cookie=getCookie(); if(!cookie.isEmpty()) c.setRequestProperty("Cookie",cookie);
                      int code=c.getResponseCode();
                      java.io.InputStream in=(code>=200&&code<400)?c.getInputStream():c.getErrorStream();
                      if(in==null) return "ERROR HTTP "+code;
                      BufferedReader br=new BufferedReader(new InputStreamReader(in,"UTF-8"));
                      StringBuilder out=new StringBuilder(); String line;
                      while((line=br.readLine())!=null) out.append(line);
                      br.close();
                      return code>=200&&code<300?out.toString():"ERROR HTTP "+code+": "+out;
                  } catch(Exception e) { return "ERROR: "+e.getMessage(); }
                  finally { if(c!=null) c.disconnect(); }
              }

              private JSONArray dataArray(String raw) {
                  try {
                      if(raw==null || raw.startsWith("ERROR")) return new JSONArray();
                      Object parsed=new org.json.JSONTokener(raw).nextValue();
                      if(parsed instanceof JSONArray) return (JSONArray)parsed;
                      if(parsed instanceof JSONObject) {
                          JSONObject obj=(JSONObject)parsed;
                          JSONArray arr=obj.optJSONArray("data"); if(arr!=null) return arr;
                          arr=obj.optJSONArray("records"); if(arr!=null) return arr;
                      }
                  } catch(Exception ignored) {}
                  return new JSONArray();
              }

              private String money(double amount) {
                  return String.format(Locale.US,"%,.0f",amount);
              }

              private String urlEncode(String value) {
                  try { return java.net.URLEncoder.encode(value==null?"":value,"UTF-8"); }
                  catch(Exception e) { return ""; }
              }

              private static class ApiResult {
                  int code;
                  JSONObject body;
                  String cookie;
              }

              private ApiResult request(String method, String path, JSONObject payload) {
                  ApiResult result = new ApiResult();
                  HttpURLConnection c = null;
                  try {
                      c = (HttpURLConnection)new URL(API + path).openConnection();
                      c.setRequestMethod(method);
                      c.setConnectTimeout(15000);
                      c.setReadTimeout(15000);
                      c.setRequestProperty("Accept","application/json");
                      String cookie = getCookie();
                      if (!cookie.isEmpty()) c.setRequestProperty("Cookie",cookie);
                      if (payload != null) {
                          c.setDoOutput(true);
                          c.setRequestProperty("Content-Type","application/json; charset=utf-8");
                          byte[] bytes = payload.toString().getBytes("UTF-8");
                          try (OutputStream out = c.getOutputStream()) {
                              out.write(bytes);
                          }
                      }
                      result.code = c.getResponseCode();
                      String setCookie = c.getHeaderField("Set-Cookie");
                      if (setCookie != null) {
                          int semicolon = setCookie.indexOf(';');
                          result.cookie = semicolon >= 0 ? setCookie.substring(0,semicolon) : setCookie;
                      }
                      java.io.InputStream stream = result.code >= 200 && result.code < 400
                          ? c.getInputStream() : c.getErrorStream();
                      if (stream != null) {
                          BufferedReader reader = new BufferedReader(new InputStreamReader(stream,"UTF-8"));
                          StringBuilder b = new StringBuilder();
                          String line;
                          while ((line = reader.readLine()) != null) b.append(line);
                          reader.close();
                          try { result.body = new JSONObject(b.toString()); }
                          catch (Exception ignored) { result.body = null; }
                      }
                  } catch (Exception e) {
                      result.code = -1;
                  } finally {
                      if (c != null) c.disconnect();
                  }
                  return result;
              }

              private SharedPreferences prefs() {
                  return getSharedPreferences(PREFS,MODE_PRIVATE);
              }

              private String getCookie() {
                  return prefs().getString(COOKIE_KEY,"");
              }

              private void saveCookie(String cookie) {
                  if (cookie == null || cookie.isEmpty()) return;
                  prefs().edit().putString(COOKIE_KEY,cookie).apply();
              }

              private void clearCookie() {
                  prefs().edit().remove(COOKIE_KEY).apply();
              }

              private void loadSongs() {
                  if (songResults == null) {
                      songResults = column();
                      content.addView(songResults);
                  }

                  // Each refresh supersedes any earlier request. Only the newest request
                  // is allowed to update the currently displayed song list.
                  final int requestId = ++songRequestId;
                  songResults.removeAllViews();
                  songResults.addView(label("Loading songs…",14,muted,false));

                  new Thread(() -> {
                      String body = null;
                      String error = null;
                      HttpURLConnection c = null;
                      try {
                          URL u = new URL(API + "/api/db/songs?select=id,title,artist,genre,plays,cover_url,audio_url,file_url,created_at&eq.approved=1&order=created_at.desc&limit=200");
                          c = (HttpURLConnection)u.openConnection();
                          c.setConnectTimeout(12000);
                          c.setReadTimeout(12000);
                          c.setRequestProperty("Accept","application/json");

                          int code = c.getResponseCode();
                          java.io.InputStream stream =
                              code >= 200 && code < 300 ? c.getInputStream() : c.getErrorStream();

                          if (stream == null) {
                              error = "Song service returned HTTP " + code;
                          } else {
                              BufferedReader r = new BufferedReader(
                                  new InputStreamReader(stream,"UTF-8"));
                              StringBuilder b = new StringBuilder();
                              String line;
                              while ((line=r.readLine()) != null) b.append(line);
                              r.close();

                              if (code >= 200 && code < 300) body = b.toString();
                              else error = "Song service returned HTTP " + code;
                          }
                      } catch (Exception e) {
                          error = "Unable to load songs. Check your internet connection.";
                      } finally {
                          if (c != null) c.disconnect();
                      }

                      final String data = body;
                      final String problem = error;

                      runOnUiThread(() -> {
                          if (isFinishing() ||
                              requestId != songRequestId ||
                              (!"Home".equals(tab) && !"Discover".equals(tab)) ||
                              songResults == null) {
                              return;
                          }

                          songResults.removeAllViews();

                          if (data == null) {
                              songResults.addView(label(
                                  problem == null ? "Unable to load songs." : problem,
                                  14,muted,false));

                              Button retry = new Button(this);
                              retry.setText("Try again");
                              retry.setAllCaps(false);
                              retry.setTextColor(Color.WHITE);
                              retry.setBackgroundTintList(
                                  android.content.res.ColorStateList.valueOf(orange));
                              retry.setOnClickListener(v -> loadSongs());

                              LinearLayout.LayoutParams retryParams =
                                  new LinearLayout.LayoutParams(-1,dp(48));
                              retryParams.bottomMargin = dp(10);
                              songResults.addView(retry,retryParams);
                              return;
                          }

                          try {
                              Object parsed = new org.json.JSONTokener(data).nextValue();

                              JSONArray songs =
                                  parsed instanceof JSONArray ? (JSONArray)parsed :
                                  parsed instanceof JSONObject ?
                                      ((JSONObject)parsed).optJSONArray("data") : null;

                              if (songs == null && parsed instanceof JSONObject) {
                                  songs = ((JSONObject)parsed).optJSONArray("records");
                              }

                              if (songs == null) {
                                  songResults.addView(label(
                                      "Unexpected song data format.",14,muted,false));
                                  return;
                              }

                              cachedSongs = songs;
                              renderSongs();
                          } catch (Exception e) {
                              songResults.removeAllViews();
                              songResults.addView(label(
                                  "Unexpected song data format.",14,muted,false));
                          }
                      });
                  }).start();
              }

              private long parseSongDate(String raw) {
                  if (raw == null || raw.trim().isEmpty()) return 0L;
                  String value = raw.trim();
                  String[] patterns = {"yyyy-MM-dd'T'HH:mm:ss.SSS'Z'", "yyyy-MM-dd'T'HH:mm:ss'Z'", "yyyy-MM-dd'T'HH:mm:ss", "yyyy-MM-dd HH:mm:ss", "yyyy-MM-dd"};
                  for (String pattern : patterns) {
                      try {
                          java.text.SimpleDateFormat format = new java.text.SimpleDateFormat(pattern, java.util.Locale.US);
                          format.setLenient(false);
                          format.setTimeZone(java.util.TimeZone.getTimeZone("UTC"));
                          return format.parse(value).getTime();
                      } catch (Exception ignored) {}
                  }
                  return 0L;
              }

              private void renderSongs() {
                  if (songResults == null) return;

                  // Always rebuild the dedicated results container instead of
                  // appending rows. This prevents duplicate songs after refresh.
                  songResults.removeAllViews();

                  if (genreFilterBar != null) {
                      genreFilterBar.removeAllViews();

                      Set<String> genres = new LinkedHashSet<>();
                      genres.add("All");

                      for (int i = 0; i < cachedSongs.length(); i++) {
                          JSONObject item = cachedSongs.optJSONObject(i);
                          if (item == null) continue;

                          String genre = item.optString("genre","").trim();
                          if (!genre.isEmpty()) genres.add(genre);
                      }

                      if (!genres.contains(selectedGenre)) {
                          selectedGenre = "All";
                      }

                      for (String genre : genres) {
                          Button filter = new Button(this);
                          filter.setText(genre);
                          filter.setAllCaps(false);
                          filter.setTextSize(12);
                          filter.setTextColor(
                              genre.equalsIgnoreCase(selectedGenre) ? Color.WHITE : white);
                          filter.setBackgroundTintList(
                              android.content.res.ColorStateList.valueOf(
                                  genre.equalsIgnoreCase(selectedGenre) ? orange : panel));

                          filter.setOnClickListener(v -> {
                              selectedGenre = genre;
                              renderSongs();
                          });

                          LinearLayout.LayoutParams filterParams =
                              new LinearLayout.LayoutParams(-2,dp(42));
                          filterParams.rightMargin = dp(6);
                          genreFilterBar.addView(filter,filterParams);
                      }
                  }

                  String query = songSearchInput == null ? "" :
                      songSearchInput.getText().toString().trim().toLowerCase(Locale.ROOT);

                  int shown = 0;
                  java.util.ArrayList<JSONObject> displaySongs = new java.util.ArrayList<>();
                  for (int i=0;i<cachedSongs.length();i++) {
                      JSONObject item = cachedSongs.optJSONObject(i);
                      if (item != null) displaySongs.add(item);
                  }
                  if ("Top Charts".equals(homeCategory) && "Home".equals(tab)) {
                      // Top Charts ranks the fetched approved catalogue by recorded lifetime plays.
                      java.util.Collections.sort(displaySongs, (a,b) -> Long.compare(b.optLong("plays",0), a.optLong("plays",0)));
                  } else if ("Trending".equals(homeCategory) && "Home".equals(tab)) {
                      // The current API does not expose a dated play-history endpoint. Until it does,
                      // Trending prioritizes songs released in the last 30 days, then their recorded plays.
                      final long now = System.currentTimeMillis();
                      final long thirtyDays = 30L * 24L * 60L * 60L * 1000L;
                      java.util.Collections.sort(displaySongs, (a,b) -> {
                          long aDate = parseSongDate(a.optString("created_at", ""));
                          long bDate = parseSongDate(b.optString("created_at", ""));
                          boolean aRecent = aDate > 0 && now - aDate >= 0 && now - aDate <= thirtyDays;
                          boolean bRecent = bDate > 0 && now - bDate >= 0 && now - bDate <= thirtyDays;
                          if (aRecent != bRecent) return aRecent ? -1 : 1;
                          if (aRecent && bRecent) {
                              int playCompare = Long.compare(b.optLong("plays",0), a.optLong("plays",0));
                              if (playCompare != 0) return playCompare;
                              return Long.compare(bDate, aDate);
                          }
                          return Long.compare(b.optLong("plays",0), a.optLong("plays",0));
                      });
                  }

                  for (int i = 0; i < displaySongs.size(); i++) {
                      JSONObject song = displaySongs.get(i);
                      if (song == null) continue;

                      String name = song.optString("title","Untitled song");
                      String by = song.optString("artist","Unknown artist");
                      String genre = song.optString("genre","Music");

                      String searchable =
                          (name + " " + by + " " + genre).toLowerCase(Locale.ROOT);

                      if (!query.isEmpty() && !searchable.contains(query)) continue;

                      if (!"All".equalsIgnoreCase(selectedGenre) &&
                          !genre.trim().equalsIgnoreCase(selectedGenre)) {
                          continue;
                      }

                      String playsCount = song.optString("plays","0");

                      // Match the supplied reference: white rounded horizontal song card,
                      // square cover art when the API provides it, metadata, and orange play button.
                      LinearLayout row = new LinearLayout(this);
                      row.setOrientation(LinearLayout.HORIZONTAL);
                      row.setGravity(Gravity.CENTER_VERTICAL);
                      row.setBackground(rounded(Color.WHITE,18,border));
                      row.setElevation(dp(2));
                      row.setPadding(dp(12),dp(12),dp(12),dp(12));

                      FrameLayout coverWrap = new FrameLayout(this);
                      coverWrap.setBackground(rounded(Color.rgb(255,224,194),12,Color.TRANSPARENT));
                      TextView coverFallback = label("♫",27,orange,true);
                      coverFallback.setGravity(Gravity.CENTER);
                      coverWrap.addView(coverFallback,new FrameLayout.LayoutParams(dp(76),dp(76)));
                      row.addView(coverWrap,new LinearLayout.LayoutParams(dp(76),dp(76)));

                      LinearLayout details = column();
                      details.setGravity(Gravity.CENTER_VERTICAL);
                      details.setPadding(dp(12),0,dp(8),0);
                      details.addView(label(name,16,white,true));
                      gap(details,5);
                      details.addView(label(by + " • " + genre,12,muted,false));
                      gap(details,4);
                      details.addView(label(playsCount + " plays",11,muted,false));
                      row.addView(details,new LinearLayout.LayoutParams(0,-2,1));

                      TextView play = label("▶",20,Color.WHITE,true);
                      play.setGravity(Gravity.CENTER);
                      play.setBackground(rounded(orange,40,orange));
                      row.addView(play,new LinearLayout.LayoutParams(dp(46),dp(46)));
                      row.setOnClickListener(v -> playSong(song));

                      String artworkUrl = song.optString("cover_url",song.optString("cover_image_url",song.optString("artwork_url",""))).trim();
                      if (artworkUrl.startsWith("https://") || artworkUrl.startsWith("http://")) {
                          new Thread(() -> {
                              HttpURLConnection conn = null;
                              try {
                                  conn = (HttpURLConnection)new URL(artworkUrl).openConnection();
                                  conn.setConnectTimeout(6000); conn.setReadTimeout(6000);
                                  Bitmap bitmap = BitmapFactory.decodeStream(conn.getInputStream());
                                  if (bitmap != null) runOnUiThread(() -> {
                                      ImageView image = new ImageView(this);
                                      image.setImageBitmap(bitmap);
                                      image.setScaleType(ImageView.ScaleType.CENTER_CROP);
                                      coverWrap.removeAllViews();
                                      coverWrap.addView(image,new FrameLayout.LayoutParams(dp(76),dp(76)));
                                  });
                              } catch(Exception ignored) { }
                              finally { if(conn != null) conn.disconnect(); }
                          }).start();
                      }

                      LinearLayout.LayoutParams rowParams = new LinearLayout.LayoutParams(-1,-2);
                      rowParams.bottomMargin = dp(12);
                      songResults.addView(row,rowParams);
                      shown++;
                  }

                  if (cachedSongs.length() == 0) {
                      songResults.addView(label(
                          "No approved songs found.",14,muted,false));
                  } else if (shown == 0) {
                      songResults.addView(label(
                          "No songs match your search and genre filter.",
                          14,muted,false));
                  }
              }

              private String resolveAudioUrl(JSONObject song) {
                  if (song == null) return "";
                  String[] keys = {"audio_url", "file_url", "stream_url", "url"};
                  for (String key : keys) {
                      String value = song.optString(key, "").trim();
                      if (value.isEmpty() || value.equalsIgnoreCase("null")) continue;
                      if (value.startsWith("https://")) return value;
                      if (value.startsWith("http://nilesoniq.com/")) return "https://nilesoniq.com/" + value.substring("http://nilesoniq.com/".length());
                      if (value.startsWith("http://www.nilesoniq.com/")) return "https://www.nilesoniq.com/" + value.substring("http://www.nilesoniq.com/".length());
                      if (value.startsWith("/")) return API + value;
                      if (value.startsWith("api/storage/public/")) return API + "/" + value;
                      if (value.startsWith("audio/")) value = value.substring("audio/".length());
                      if (!value.contains("://") && !value.startsWith("data:")) {
                          return API + "/api/storage/public/audio/" + value.replace("\\", "/");
                      }
                  }
                  return "";
              }

              private void playSong(JSONObject song) {
                  if (song == null) {
                      Toast.makeText(this,"This song is not available.",Toast.LENGTH_LONG).show();
                      return;
                  }
                  String url = resolveAudioUrl(song);
                  if (url.isEmpty() || !url.startsWith("https://")) {
                      Toast.makeText(this,"This song has no playable audio link saved. Check the song's audio URL.",Toast.LENGTH_LONG).show();
                      return;
                  }
                  // Capture the validated URL in an effectively-final variable for the background thread.
                  final String playbackUrl = url;
                  final String playbackSongId = song.optString("id", "").trim();
                  releasePlayer();
                  final int id = ++token;
                  title = song.optString("title","Untitled song");
                  artist = song.optString("artist","Unknown artist");
                  audioUrl = url;
                  preparing = true;
                  playing = false;
                  screen("Player");

                  try {
                      // Construct MediaPlayer on the UI thread so Android always has a callback Looper.
                      MediaPlayer mp = new MediaPlayer();
                      player = mp;
                      mp.setAudioAttributes(new AudioAttributes.Builder()
                          .setUsage(AudioAttributes.USAGE_MEDIA)
                          .setContentType(AudioAttributes.CONTENT_TYPE_MUSIC).build());
                      mp.setOnPreparedListener(p -> {
                          if (id != token || isFinishing()) {
                              try { p.release(); } catch (Exception ignored) {}
                              return;
                          }
                          preparing = false;
                          try {
                              p.start();
                              playing = true;
                              if (!playbackSongId.isEmpty()) recordSongPlay(playbackSongId);
                              screen("Player");
                          } catch (Exception e) {
                              audioUrl = "";
                              releasePlayer();
                              Toast.makeText(this,"Unable to start playback. Please try again.",Toast.LENGTH_LONG).show();
                              if (!isFinishing()) screen("Player");
                          }
                      });
                      mp.setOnCompletionListener(p -> {
                          if (id == token) {
                              playing = false;
                              preparing = false;
                              if (!isFinishing()) screen("Player");
                          }
                      });
                      mp.setOnErrorListener((p, what, extra) -> {
                          android.util.Log.e("NileSoniQ", "Audio playback error: what=" + what + ", extra=" + extra + ", url=" + playbackUrl);
                          if (id == token) {
                              audioUrl = "";
                              releasePlayer();
                              Toast.makeText(this,"This audio could not be played. Try another song.",Toast.LENGTH_LONG).show();
                              if (!isFinishing()) screen("Player");
                          }
                          return true;
                      });
                      // Keep MediaPlayer operations on the same UI Looper used for its callbacks.
                      java.util.HashMap<String, String> audioHeaders = new java.util.HashMap<>();
                      audioHeaders.put("User-Agent", "NileSoniQ Android");
                      audioHeaders.put("Accept", "*/*");
                      mp.setDataSource(this, android.net.Uri.parse(playbackUrl), audioHeaders);
                      mp.prepareAsync();
                      new android.os.Handler(android.os.Looper.getMainLooper()).postDelayed(() -> {
                          if (id == token && preparing && !isFinishing()) {
                              audioUrl = "";
                              releasePlayer();
                              Toast.makeText(this, "Audio did not start. The saved audio link may be unavailable or the file may not be a supported audio format.", Toast.LENGTH_LONG).show();
                              screen("Player");
                          }
                      }, 30000);
                  } catch (Exception e) {
                      audioUrl = "";
                      preparing = false;
                      releasePlayer();
                      Toast.makeText(this,"Could not load this audio. Please try another song.",Toast.LENGTH_LONG).show();
                      if (!isFinishing()) screen("Player");
                  }
              }

              private void recordSongPlay(String songId) {
                  if(songId==null || songId.trim().isEmpty()) return;
                  new Thread(() -> {
                      JSONObject payload=new JSONObject();
                      try { payload.put("song_id",songId); } catch(Exception ignored) {}
                      ApiResult result=request("POST","/api/rpc/record_song_play",payload);
                      if(result.code<200 || result.code>=300) Log.w("NileSoniQ", "Play record request failed with HTTP " + result.code);
                  }).start();
              }

              private void toggle() {
                  if (player == null || preparing) return;
                  try {
                      if (player.isPlaying()) {
                          player.pause();
                          playing = false;
                      } else {
                          player.start();
                          playing = true;
                      }
                      screen("Player");
                  } catch (Exception e) {
                      Toast.makeText(this,"Playback is unavailable.",Toast.LENGTH_SHORT).show();
                  }
              }

              private void stopPlayback() {
                  releasePlayer();
                  audioUrl = "";
                  title = "";
                  artist = "";
                  screen("Player");
              }

              private void releasePlayer() {
                  token++;
                  MediaPlayer old = player;
                  player = null;
                  preparing = false;
                  playing = false;
                  if (old != null) {
                      try { old.setOnPreparedListener(null); } catch (Exception ignored) {}
                      try { old.setOnCompletionListener(null); } catch (Exception ignored) {}
                      try { old.setOnErrorListener(null); } catch (Exception ignored) {}
                      try { old.stop(); } catch (Exception ignored) {}
                      try { old.release(); } catch (Exception ignored) {}
                  }
              }

              @Override
              protected void onStop() {
                  super.onStop();
                  if (player != null) {
                      try {
                          if (player.isPlaying()) {
                              player.pause();
                              playing = false;
                          }
                      } catch (Exception ignored) {}
                  }
              }

              @Override
              protected void onDestroy() {
                  releasePlayer();
                  super.onDestroy();
              }
          }
          EOF

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace assembleDebug 2>&1 | tee build.log

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NileSoniQ-Build-Logs
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify APK
        if: success()
        shell: bash
        run: |
          set -euxo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NileSoniQ-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
