name: NileSoniQ Android APK

'on':
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build NileSoniQ APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          packages: platform-tools

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euxo pipefail
          sdkmanager --licenses
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Gradle
        shell: bash
        run: |
          set -euxo pipefail
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          echo "$GITHUB_WORKSPACE/gradle-8.5/bin" >> "$GITHUB_PATH"
          "$GITHUB_WORKSPACE/gradle-8.5/bin/gradle" --version

      - name: Generate Android project
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p app/src/main/java/com/nilesoniq/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          # Use the exact supplied NileSoniQ app-icon artwork.
          echo '
