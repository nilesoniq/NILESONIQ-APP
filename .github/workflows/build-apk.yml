name: NileSoniQ Android APK

'on':
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build NileSoniQ APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          packages: platform-tools

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euxo pipefail
          sdkmanager --licenses
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Gradle
        shell: bash
        run: |
          set -euxo pipefail
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          echo "$GITHUB_WORKSPACE/gradle-8.5/bin" >> "$GITHUB_PATH"
          "$GITHUB_WORKSPACE/gradle-8.5/bin/gradle" --version

      - name: Generate Android project
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p app/src/main/java/com/nilesoniq/app
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = 'NileSoniQ'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.1.4' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.nilesoniq.app'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.nilesoniq.app'
                  minSdk 23
                  targetSdk 34
                  versionCode 6
                  versionName '1.5'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">NileSoniQ</string>
          </resources>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#FF7A00</item>
                  <item name="android:statusBarColor">#090909</item>
                  <item name="android:navigationBarColor">#090909</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:usesCleartextTraffic="false"
                  android:theme="@style/AppTheme">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/nilesoniq/app/MainActivity.java <<'EOF'
          package com.nilesoniq.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.media.AudioAttributes;
          import android.media.MediaPlayer;
          import android.content.SharedPreferences;
          import android.net.Uri;
          import android.database.Cursor;
          import android.text.InputType;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;

          public class MainActivity extends Activity {
              private static final String API = "https://nilesoniq.com";
              private static final String PREFS = "nilesoniq_session";
              private static final String COOKIE_KEY = "session_cookie";
              private final int bg = Color.rgb(9,9,9);
              private final int panel = Color.rgb(23,23,23);
              private final int orange = Color.rgb(255,122,0);
              private final int white = Color.WHITE;
              private final int muted = Color.rgb(175,175,175);
              private LinearLayout root, content;
              private String tab = "Home";
              private MediaPlayer player;
              private String title = "", artist = "", audioUrl = "";
              private boolean playing = false, preparing = false;
              private int token = 0;
              private JSONObject signedInUser;
              private boolean authBusy = false;
              private String authMode = "login";
              private EditText nameInput, phoneInput, emailInput, passwordInput;
              private EditText uploadTitleInput, uploadArtistInput, uploadGenreInput, uploadDescriptionInput;
              private Uri selectedAudioUri, selectedCoverUri;
              private boolean uploadBusy = false;
              private static final int PICK_AUDIO = 6101;
              private static final int PICK_COVER = 6102;

              @Override
              public void onCreate(Bundle state) {
                  super.onCreate(state);
                  getWindow().setStatusBarColor(bg);
                  getWindow().setNavigationBarColor(bg);
                  screen("Home");
                  checkSession();
              }

              private int dp(int n) {
                  return (int)(n * getResources().getDisplayMetrics().density + 0.5f);
              }

              private TextView label(String s, int size, int color, boolean bold) {
                  TextView v = new TextView(this);
                  v.setText(s);
                  v.setTextSize(size);
                  v.setTextColor(color);
                  if (bold) v.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
                  return v;
              }

              private LinearLayout column() {
                  LinearLayout l = new LinearLayout(this);
                  l.setOrientation(LinearLayout.VERTICAL);
                  return l;
              }

              private void gap(LinearLayout l, int height) {
                  l.addView(new View(this), new LinearLayout.LayoutParams(1, dp(height)));
              }

              private void screen(String name) {
                  tab = name;
                  root = column();
                  root.setBackgroundColor(bg);
                  root.setPadding(dp(18),dp(14),dp(18),dp(8));

                  LinearLayout header = new LinearLayout(this);
                  header.setGravity(Gravity.CENTER_VERTICAL);
                  TextView logo = label("NileSoniQ",26,orange,true);
                  header.addView(logo,new LinearLayout.LayoutParams(0,-2,1));
                  header.addView(label("MUSIC • COMMUNITY",10,muted,true));
                  root.addView(header);
                  gap(root,18);

                  ScrollView scroll = new ScrollView(this);
                  content = column();
                  content.setPadding(0,0,0,dp(16));
                  scroll.addView(content);
                  root.addView(scroll,new LinearLayout.LayoutParams(-1,0,1));

                  LinearLayout nav = new LinearLayout(this);
                  nav.setGravity(Gravity.CENTER);
                  String[] names = {"Home","Discover","Player","Community","Profile"};
                  for (String n : names) {
                      TextView item = label(n,10,n.equals(tab)?orange:muted,true);
                      item.setGravity(Gravity.CENTER);
                      item.setPadding(dp(2),dp(12),dp(2),dp(12));
                      item.setOnClickListener(v -> screen(n));
                      nav.addView(item,new LinearLayout.LayoutParams(0,-2,1));
                  }
                  root.addView(nav);
                  setContentView(root);

                  if (name.equals("Home")) home();
                  else if (name.equals("Discover")) discover();
                  else if (name.equals("Player")) playerScreen();
                  else if (name.equals("Community")) community();
                  else profile();
              }

              private void heading(String h, String sub) {
                  content.addView(label(h,25,white,true));
                  gap(content,6);
                  content.addView(label(sub,14,muted,false));
                  gap(content,18);
              }

              private void card(String h, String sub) {
                  LinearLayout box = column();
                  box.setBackgroundColor(panel);
                  box.setPadding(dp(15),dp(14),dp(15),dp(14));
                  box.addView(label(h,17,white,true));
                  gap(box,7);
                  box.addView(label(sub,13,muted,false));
                  LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(-1,-2);
                  p.bottomMargin = dp(12);
                  content.addView(box,p);
              }

              private void action(String name, Runnable run) {
                  Button b = new Button(this);
                  b.setText(name);
                  b.setAllCaps(false);
                  b.setTextColor(white);
                  b.setBackgroundTintList(android.content.res.ColorStateList.valueOf(orange));
                  b.setOnClickListener(v -> run.run());
                  LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(-1,dp(48));
                  p.bottomMargin = dp(10);
                  content.addView(b,p);
              }

              private EditText field(String hint, int type) {
                  EditText e = new EditText(this);
                  e.setSingleLine(true);
                  e.setTextColor(white);
                  e.setHintTextColor(muted);
                  e.setHint(hint);
                  e.setTextSize(15);
                  e.setInputType(type);
                  e.setPadding(dp(12),dp(8),dp(12),dp(8));
                  e.setBackgroundTintList(android.content.res.ColorStateList.valueOf(muted));
                  LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(-1,dp(52));
                  p.bottomMargin = dp(10);
                  content.addView(e,p);
                  return e;
              }

              private void home() {
                  heading("Music from everywhere.","Discover music. Find artists. Be part of the sound.");
                  card("YOUR MUSIC. YOUR COMMUNITY.",
                       "Discover your next favourite sound and connect with music creators.");
                  action("Explore music",() -> screen("Discover"));
                  action("Open music player",() -> screen("Player"));
                  content.addView(label("LATEST APPROVED SONGS",12,orange,true));
                  gap(content,12);
                  loadSongs();
              }

              private void discover() {
                  heading("Discover music","Tap a song to start listening.");
                  action("Refresh songs",this::loadSongs);
                  loadSongs();
              }

              private void playerScreen() {
                  heading("Music player","Listen to songs from NileSoniQ.");
                  if (audioUrl.isEmpty()) {
                      card("Nothing playing yet","Open Discover and tap a song to start playback.");
                  } else {
                      card(title,artist + (preparing ? "\nPreparing audio…" :
                          playing ? "\nPlaying now" : "\nPaused"));
                      action(preparing ? "Preparing…" : playing ? "Pause" : "Play / Resume",
                          this::toggle);
                      action("Stop playback",this::stopPlayback);
                  }
                  action("Browse songs",() -> screen("Discover"));
              }

              private void community() {
                  heading("Community","Connect through music.");
                  card("Artist posts","Music news, releases, achievements and updates.");
                  card("Artist chat","Community messaging will be available in a future update.");
              }

              private void profile() {
                  heading("Your account","Use your existing NileSoniQ website account.");
                  if (signedInUser != null) {
                      String email = signedInUser.optString("email","Account");
                      String artistName = signedInUser.optString("artist_name","");
                      card("Signed in",email + (artistName.isEmpty() ? "" : "\n"+artistName));
                      action("Open Artist Dashboard",this::artistDashboard);
                      action("Refresh account session",this::checkSession);
                      action("Log out",this::logout);
                      card("Artist studio","Review your song submissions, recorded plays, wallet balance and withdrawal history, and upload songs directly in the app.");
                  } else {
                      card("Sign in or create an account",
                          "Use the same email and password you use on nilesoniq.com.");
                      action(authMode.equals("login") ? "Don't have an account? Sign up" : "Already have an account? Sign in",
                          () -> {
                              authMode = authMode.equals("login") ? "register" : "login";
                              profile();
                          });
                      if (authMode.equals("register")) {
                          nameInput = field("Artist or display name",InputType.TYPE_CLASS_TEXT | InputType.TYPE_TEXT_FLAG_CAP_WORDS);
                          phoneInput = field("Phone number (optional)",InputType.TYPE_CLASS_PHONE);
                      } else {
                          nameInput = null;
                          phoneInput = null;
                      }
                      emailInput = field("Email address",InputType.TYPE_CLASS_TEXT | InputType.TYPE_TEXT_VARIATION_EMAIL_ADDRESS);
                      passwordInput = field("Password (minimum 6 characters)",InputType.TYPE_CLASS_TEXT | InputType.TYPE_TEXT_VARIATION_PASSWORD);
                      action(authBusy ? "Please wait…" : authMode.equals("login") ? "Sign in" : "Create account",
                          this::submitAuth);
                  }
              }

              private void submitAuth() {
                  if (authBusy) return;
                  String email = emailInput == null ? "" : emailInput.getText().toString().trim();
                  String password = passwordInput == null ? "" : passwordInput.getText().toString();
                  String displayName = nameInput == null ? "" : nameInput.getText().toString().trim();
                  String phone = phoneInput == null ? "" : phoneInput.getText().toString().trim();

                  if (email.isEmpty() || password.isEmpty()) {
                      Toast.makeText(this,"Enter your email and password.",Toast.LENGTH_LONG).show();
                      return;
                  }
                  if (authMode.equals("register") && password.length() < 6) {
                      Toast.makeText(this,"Password must be at least 6 characters.",Toast.LENGTH_LONG).show();
                      return;
                  }

                  authBusy = true;
                  profile();
                  new Thread(() -> {
                      JSONObject payload = new JSONObject();
                      try {
                          payload.put("email",email);
                          payload.put("password",password);
                          if (authMode.equals("register")) {
                              payload.put("name",displayName);
                              payload.put("artist_name",displayName);
                              payload.put("phone",phone);
                          }
                          String endpoint = authMode.equals("register")
                              ? "/api/auth/register" : "/api/auth/login";
                          ApiResult result = request("POST",endpoint,payload);
                          JSONObject response = result.body;
                          if (result.cookie != null && !result.cookie.isEmpty()) {
                              saveCookie(result.cookie);
                          }
                          if (result.code >= 200 && result.code < 300 &&
                              response != null && response.optBoolean("success")) {
                              JSONObject user = response.optJSONObject("user");
                              runOnUiThread(() -> {
                                  authBusy = false;
                                  signedInUser = user == null ? new JSONObject() : user;
                                  authMode = "login";
                                  screen("Profile");
                                  Toast.makeText(this,"Account connected successfully.",Toast.LENGTH_LONG).show();
                              });
                          } else {
                              String message = response == null
                                  ? "Unable to connect. Please try again."
                                  : response.optString("error","Sign-in failed. Check your details.");
                              runOnUiThread(() -> {
                                  authBusy = false;
                                  if (!isFinishing()) {
                                      screen("Profile");
                                      Toast.makeText(this,message,Toast.LENGTH_LONG).show();
                                  }
                              });
                          }
                      } catch (Exception e) {
                          runOnUiThread(() -> {
                              authBusy = false;
                              if (!isFinishing()) {
                                  screen("Profile");
                                  Toast.makeText(this,"Connection failed. Check your internet and try again.",Toast.LENGTH_LONG).show();
                              }
                          });
                      }
                  }).start();
              }

              private void checkSession() {
                  new Thread(() -> {
                      ApiResult result = request("GET","/api/auth/me",null);
                      JSONObject response = result.body;
                      JSONObject user = response == null ? null : response.optJSONObject("user");
                      boolean authenticated = response != null && response.optBoolean("authenticated") && user != null;
                      runOnUiThread(() -> {
                          if (isFinishing()) return;
                          if (authenticated) {
                              signedInUser = user;
                          } else {
                              signedInUser = null;
                              if (response != null && !response.optBoolean("authenticated")) {
                                  clearCookie();
                              }
                          }
                          if (tab.equals("Profile")) screen("Profile");
                      });
                  }).start();
              }

              private void logout() {
                  if (authBusy) return;
                  authBusy = true;
                  new Thread(() -> {
                      request("POST","/api/auth/logout",new JSONObject());
                      clearCookie();
                      runOnUiThread(() -> {
                          authBusy = false;
                          signedInUser = null;
                          authMode = "login";
                          screen("Profile");
                          Toast.makeText(this,"You have been logged out.",Toast.LENGTH_SHORT).show();
                      });
                  }).start();
              }

              private void artistDashboard() {
                  if (signedInUser == null) {
                      Toast.makeText(this,"Please sign in first.",Toast.LENGTH_SHORT).show();
                      screen("Profile");
                      return;
                  }
                  heading("Artist Dashboard","Your songs, performance and earnings");
                  card("Loading dashboard…","Fetching records linked to your signed-in account.");
                  final String userId = signedInUser.optString("id", signedInUser.optString("user_id",""));
                  final String email = signedInUser.optString("email","Artist account");
                  final String artistName = signedInUser.optString("artist_name", signedInUser.optString("name",""));
                  content.removeAllViews();
                  heading("Artist Dashboard","Your songs, performance and earnings");
                  card("Artist profile", (artistName.isEmpty()?email:artistName+"\n"+email));
                  card("Song submissions","Loading song statuses and play counts…");
                  card("Earnings & withdrawals","Loading existing wallet and payout records…");
                  new Thread(() -> {
                      String songsRaw = getApiText("/api/db/songs?select=id,title,artist,plays,approved,review_status,created_at&eq.artist_id="+urlEncode(userId)+"&order=created_at.desc&limit=100");
                      String walletRaw = getApiText("/api/db/artist_wallets?select=balance&eq.user_id="+urlEncode(userId)+"&limit=10");
                      String payoutsRaw = getApiText("/api/db/artist_payouts?select=amount,status&eq.user_id="+urlEncode(userId)+"&limit=100");
                      String withdrawalsRaw = getApiText("/api/db/withdrawal_requests?select=amount,status&eq.artist_id="+urlEncode(userId)+"&limit=100");
                      JSONArray songs = dataArray(songsRaw);
                      JSONArray wallets = dataArray(walletRaw);
                      JSONArray payouts = dataArray(payoutsRaw);
                      JSONArray withdrawals = dataArray(withdrawalsRaw);
                      int approved=0, pending=0, rejected=0;
                      long plays=0;
                      StringBuilder list = new StringBuilder();
                      for (int i=0;i<songs.length();i++) {
                          JSONObject song=songs.optJSONObject(i);
                          if (song==null) continue;
                          String status=song.optString("review_status","").toLowerCase();
                          boolean isApproved=song.optBoolean("approved",false);
                          if (isApproved || status.equals("approved")) approved++;
                          else if (status.equals("rejected")) rejected++;
                          else pending++;
                          plays += song.optLong("plays",0);
                          if (list.length()<6500) {
                              if (list.length()>0) list.append("\n\n");
                              list.append(song.optString("title","Untitled song"));
                              list.append("\nStatus: ").append(isApproved?"Approved":(status.equals("rejected")?"Rejected":"Pending review"));
                              list.append("\nPlays: ").append(song.optLong("plays",0));
                          }
                      }
                      double balance=0, withdrawn=0;
                      for(int i=0;i<wallets.length();i++) { JSONObject w=wallets.optJSONObject(i); if(w!=null) balance += w.optDouble("balance",0); }
                      for(int i=0;i<payouts.length();i++) {
                          JSONObject w=payouts.optJSONObject(i); if(w==null) continue;
                          String st=w.optString("status","").toLowerCase();
                          if(st.equals("completed")||st.equals("success")||st.equals("successful")||st.equals("paid")) withdrawn += w.optDouble("amount",0);
                      }
                      int pendingWithdrawals=0;
                      for(int i=0;i<withdrawals.length();i++) {
                          JSONObject w=withdrawals.optJSONObject(i); if(w==null) continue;
                          String st=w.optString("status","").toLowerCase();
                          if(st.equals("completed")||st.equals("success")||st.equals("successful")||st.equals("paid")) withdrawn += w.optDouble("amount",0);
                          else if(st.equals("pending")||st.equals("processing")||st.equals("requested")) pendingWithdrawals++;
                      }
                      final String songSummary="Songs: "+songs.length()+"\nApproved: "+approved+"\nPending review: "+pending+"\nRejected: "+rejected+"\nRecorded plays: "+plays;
                      final String earnings="Available balance: UGX "+money(balance)+"\nAmount withdrawn (recorded as paid): UGX "+money(withdrawn)+"\nPending withdrawal requests: "+pendingWithdrawals+"\nMinimum withdrawal: UGX 10,000";
                      final String songList=list.length()==0?"No song records were returned for this account.":list.toString();
                      runOnUiThread(() -> {
                          if(isFinishing() || signedInUser==null || !tab.equals("Profile")) return;
                          content.removeAllViews();
                          heading("Artist Dashboard","Your songs, performance and earnings");
                          card("Artist profile",(artistName.isEmpty()?email:artistName+"\n"+email));
                          card("Performance & song status",songSummary);
                          card("Earnings & withdrawals",earnings);
                          card("My songs",songList);
                          if(songsRaw.startsWith("ERROR") || walletRaw.startsWith("ERROR") || payoutsRaw.startsWith("ERROR") || withdrawalsRaw.startsWith("ERROR")) {
                              card("Data access note","Some records could not be loaded. Check the API permissions and actual table fields before relying on the figures. No withdrawal was submitted or changed.");
                          }
                          action("Upload a song in the app",this::songUploadScreen);
                          action("Refresh Artist Dashboard",this::artistDashboard);
                          action("Back to Profile",() -> screen("Profile"));
                      });
                  }).start();
              }

              private void songUploadScreen() {
                  if (signedInUser == null) {
                      Toast.makeText(this,"Please sign in first.",Toast.LENGTH_SHORT).show();
                      screen("Profile");
                      return;
                  }
                  content.removeAllViews();
                  heading("Upload a song","Choose your audio file and submit it for admin review. It will not be public until approved.");
                  uploadTitleInput = field("Song title (required)",InputType.TYPE_CLASS_TEXT | InputType.TYPE_TEXT_FLAG_CAP_SENTENCES);
                  uploadArtistInput = field("Artist name (required)",InputType.TYPE_CLASS_TEXT | InputType.TYPE_TEXT_FLAG_CAP_WORDS);
                  String display = signedInUser.optString("artist_name",signedInUser.optString("name",""));
                  if (!display.isEmpty()) uploadArtistInput.setText(display);
                  uploadGenreInput = field("Genre (e.g. Afrobeat)",InputType.TYPE_CLASS_TEXT | InputType.TYPE_TEXT_FLAG_CAP_WORDS);
                  uploadDescriptionInput = field("Description (optional)",InputType.TYPE_CLASS_TEXT | InputType.TYPE_TEXT_FLAG_CAP_SENTENCES);
                  gap(content,8);
                  card("Audio file",selectedAudioUri == null ? "No audio selected. MP3, WAV, or FLAC recommended." : getDisplayName(selectedAudioUri));
                  action("Choose audio file",() -> pickFile(PICK_AUDIO));
                  card("Cover artwork (optional)",selectedCoverUri == null ? "No cover selected." : getDisplayName(selectedCoverUri));
                  action("Choose cover artwork",() -> pickFile(PICK_COVER));
                  card("Before submitting","You confirm that you own or have permission to upload this music. The song will be saved as Pending review and will only appear publicly after admin approval.");
                  action(uploadBusy ? "Uploading…" : "Submit song for review",this::submitSongUpload);
                  action("Back to Artist Dashboard",this::artistDashboard);
              }

              private void pickFile(int requestCode) {
                  try {
                      android.content.Intent intent = new android.content.Intent(android.content.Intent.ACTION_OPEN_DOCUMENT);
                      intent.addCategory(android.content.Intent.CATEGORY_OPENABLE);
                      intent.setType(requestCode == PICK_AUDIO ? "audio/*" : "image/*");
                      startActivityForResult(intent,requestCode);
                  } catch (Exception e) {
                      Toast.makeText(this,"Could not open the file picker.",Toast.LENGTH_LONG).show();
                  }
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, android.content.Intent data) {
                  super.onActivityResult(requestCode,resultCode,data);
                  if (resultCode != RESULT_OK || data == null || data.getData() == null) return;
                  Uri uri = data.getData();
                  try { getContentResolver().takePersistableUriPermission(uri, data.getFlags() & (android.content.Intent.FLAG_GRANT_READ_URI_PERMISSION)); }
                  catch (Exception ignored) {}
                  if (requestCode == PICK_AUDIO) selectedAudioUri = uri;
                  else if (requestCode == PICK_COVER) selectedCoverUri = uri;
                  if (tab.equals("Profile")) songUploadScreen();
              }

              private String getDisplayName(Uri uri) {
                  if (uri == null) return "Not selected";
                  String name = null;
                  Cursor cursor = null;
                  try {
                      cursor = getContentResolver().query(uri,null,null,null,null);
                      if (cursor != null && cursor.moveToFirst()) {
                          int index = cursor.getColumnIndex(android.provider.OpenableColumns.DISPLAY_NAME);
                          if (index >= 0) name = cursor.getString(index);
                      }
                  } catch (Exception ignored) {} finally { if (cursor != null) cursor.close(); }
                  return name == null || name.trim().isEmpty() ? uri.getLastPathSegment() : name;
              }

              private String safeFileName(String original, String fallback) {
                  String name = original == null ? fallback : original;
                  name = name.replaceAll("[^A-Za-z0-9._-]", "_");
                  if (name.length() > 100) name = name.substring(name.length()-100);
                  return name.isEmpty() ? fallback : name;
              }

              private String uploadObject(Uri uri, String bucket, String userId, String fallback) throws Exception {
                  if (uri == null) return "";
                  String name = safeFileName(getDisplayName(uri),fallback);
                  String objectPath = userId + "/" + System.currentTimeMillis() + "_" + name;
                  java.net.URL url = new URL(API + "/api/storage/upload?bucket=" + bucket + "&path=" + urlEncode(objectPath));
                  HttpURLConnection c = (HttpURLConnection)url.openConnection();
                  try {
                      c.setRequestMethod("POST");
                      c.setConnectTimeout(20000);
                      c.setReadTimeout(120000);
                      c.setDoOutput(true);
                      c.setRequestProperty("Accept","application/json");
                      c.setRequestProperty("Content-Type",getContentResolver().getType(uri) == null ? "application/octet-stream" : getContentResolver().getType(uri));
                      String cookie = getCookie();
                      if (!cookie.isEmpty()) c.setRequestProperty("Cookie",cookie);
                      try (java.io.InputStream in = getContentResolver().openInputStream(uri); OutputStream out = c.getOutputStream()) {
                          if (in == null) throw new Exception("Could not read selected file.");
                          byte[] buffer = new byte[32768];
                          int n;
                          long total = 0;
                          while ((n = in.read(buffer)) != -1) {
                              total += n;
                              if (total > 150L * 1024L * 1024L) throw new Exception("File is larger than 150 MB. Please choose a smaller file.");
                              out.write(buffer,0,n);
                          }
                      }
                      int code = c.getResponseCode();
                      java.io.InputStream stream = code >= 200 && code < 300 ? c.getInputStream() : c.getErrorStream();
                      StringBuilder response = new StringBuilder();
                      if (stream != null) {
                          BufferedReader reader = new BufferedReader(new InputStreamReader(stream,"UTF-8"));
                          String line; while ((line = reader.readLine()) != null) response.append(line);
                          reader.close();
                      }
                      if (code < 200 || code >= 300) {
                          JSONObject err;
                          try { err = new JSONObject(response.toString()); } catch (Exception e) { err = new JSONObject(); }
                          throw new Exception(err.optString("error","File upload failed (HTTP " + code + ")."));
                      }
                      return API + "/api/storage/public/" + bucket + "/" + objectPath;
                  } finally { c.disconnect(); }
              }

              private void submitSongUpload() {
                  if (uploadBusy) return;
                  if (signedInUser == null) {
                      Toast.makeText(this,"Please sign in first.",Toast.LENGTH_LONG).show();
                      return;
                  }
                  String songTitle = uploadTitleInput == null ? "" : uploadTitleInput.getText().toString().trim();
                  String songArtist = uploadArtistInput == null ? "" : uploadArtistInput.getText().toString().trim();
                  String genre = uploadGenreInput == null ? "" : uploadGenreInput.getText().toString().trim();
                  String description = uploadDescriptionInput == null ? "" : uploadDescriptionInput.getText().toString().trim();
                  if (songTitle.isEmpty() || songArtist.isEmpty() || selectedAudioUri == null) {
                      Toast.makeText(this,"Enter the song title and artist, then choose an audio file.",Toast.LENGTH_LONG).show();
                      return;
                  }
                  uploadBusy = true;
                  songUploadScreen();
                  new Thread(() -> {
                      try {
                          String userId = signedInUser.optString("id",signedInUser.optString("user_id",""));
                          if (userId.isEmpty()) throw new Exception("Your account ID could not be found. Please sign in again.");
                          String audioUrl = uploadObject(selectedAudioUri,"audio",userId,"song_audio");
                          String coverUrl = selectedCoverUri == null ? "" : uploadObject(selectedCoverUri,"covers",userId,"song_cover");
                          JSONObject row = new JSONObject();
                          row.put("title",songTitle);
                          row.put("artist",songArtist);
                          row.put("artist_id",userId);
                          row.put("audio_url",audioUrl);
                          row.put("file_url",audioUrl);
                          if (!coverUrl.isEmpty()) row.put("cover_url",coverUrl);
                          if (!genre.isEmpty()) row.put("genre",genre);
                          if (!description.isEmpty()) row.put("description",description);
                          row.put("terms_accepted",true);
                          // New uploads must remain private until an authorized admin approves them.
                          row.put("approved",false);
                          row.put("review_status","pending");
                          row.put("status","pending");
                          ApiResult result = request("POST","/api/db/songs",row);
                          if (result.code < 200 || result.code >= 300 || result.body == null || result.body.optJSONArray("data") == null) {
                              String error = result.body == null ? "Song details could not be saved." : result.body.optString("error","Song details could not be saved.");
                              throw new Exception(error);
                          }
                          runOnUiThread(() -> {
                              uploadBusy = false;
                              selectedAudioUri = null;
                              selectedCoverUri = null;
                              Toast.makeText(this,"Song uploaded successfully and sent for admin review.",Toast.LENGTH_LONG).show();
                              artistDashboard();
                          });
                      } catch (Exception e) {
                          String message = e.getMessage() == null ? "Upload failed. Please try again." : e.getMessage();
                          runOnUiThread(() -> {
                              uploadBusy = false;
                              if (!isFinishing()) {
                                  songUploadScreen();
                                  Toast.makeText(this,message,Toast.LENGTH_LONG).show();
                              }
                          });
                      }
                  }).start();
              }

              private String getApiText(String path) {
                  HttpURLConnection c=null;
                  try {
                      c=(HttpURLConnection)new URL(API+path).openConnection();
                      c.setRequestMethod("GET"); c.setConnectTimeout(12000); c.setReadTimeout(12000);
                      c.setRequestProperty("Accept","application/json");
                      String cookie=getCookie(); if(!cookie.isEmpty()) c.setRequestProperty("Cookie",cookie);
                      int code=c.getResponseCode();
                      java.io.InputStream in=(code>=200&&code<400)?c.getInputStream():c.getErrorStream();
                      if(in==null) return "ERROR HTTP "+code;
                      BufferedReader br=new BufferedReader(new InputStreamReader(in,"UTF-8"));
                      StringBuilder out=new StringBuilder(); String line;
                      while((line=br.readLine())!=null) out.append(line);
                      br.close();
                      return code>=200&&code<300?out.toString():"ERROR HTTP "+code+": "+out;
                  } catch(Exception e) { return "ERROR: "+e.getMessage(); }
                  finally { if(c!=null) c.disconnect(); }
              }

              private JSONArray dataArray(String raw) {
                  try {
                      if(raw==null || raw.startsWith("ERROR")) return new JSONArray();
                      Object parsed=new org.json.JSONTokener(raw).nextValue();
                      if(parsed instanceof JSONArray) return (JSONArray)parsed;
                      if(parsed instanceof JSONObject) {
                          JSONObject obj=(JSONObject)parsed;
                          JSONArray arr=obj.optJSONArray("data"); if(arr!=null) return arr;
                          arr=obj.optJSONArray("records"); if(arr!=null) return arr;
                      }
                  } catch(Exception ignored) {}
                  return new JSONArray();
              }

              private String money(double amount) {
                  return String.format(java.util.Locale.US,"%,.0f",amount);
              }

              private String urlEncode(String value) {
                  try { return java.net.URLEncoder.encode(value==null?"":value,"UTF-8"); }
                  catch(Exception e) { return ""; }
              }

              private static class ApiResult {
                  int code;
                  JSONObject body;
                  String cookie;
              }

              private ApiResult request(String method, String path, JSONObject payload) {
                  ApiResult result = new ApiResult();
                  HttpURLConnection c = null;
                  try {
                      c = (HttpURLConnection)new URL(API + path).openConnection();
                      c.setRequestMethod(method);
                      c.setConnectTimeout(15000);
                      c.setReadTimeout(15000);
                      c.setRequestProperty("Accept","application/json");
                      String cookie = getCookie();
                      if (!cookie.isEmpty()) c.setRequestProperty("Cookie",cookie);
                      if (payload != null) {
                          c.setDoOutput(true);
                          c.setRequestProperty("Content-Type","application/json; charset=utf-8");
                          byte[] bytes = payload.toString().getBytes("UTF-8");
                          try (OutputStream out = c.getOutputStream()) {
                              out.write(bytes);
                          }
                      }
                      result.code = c.getResponseCode();
                      String setCookie = c.getHeaderField("Set-Cookie");
                      if (setCookie != null) {
                          int semicolon = setCookie.indexOf(';');
                          result.cookie = semicolon >= 0 ? setCookie.substring(0,semicolon) : setCookie;
                      }
                      java.io.InputStream stream = result.code >= 200 && result.code < 400
                          ? c.getInputStream() : c.getErrorStream();
                      if (stream != null) {
                          BufferedReader reader = new BufferedReader(new InputStreamReader(stream,"UTF-8"));
                          StringBuilder b = new StringBuilder();
                          String line;
                          while ((line = reader.readLine()) != null) b.append(line);
                          reader.close();
                          try { result.body = new JSONObject(b.toString()); }
                          catch (Exception ignored) { result.body = null; }
                      }
                  } catch (Exception e) {
                      result.code = -1;
                  } finally {
                      if (c != null) c.disconnect();
                  }
                  return result;
              }

              private SharedPreferences prefs() {
                  return getSharedPreferences(PREFS,MODE_PRIVATE);
              }

              private String getCookie() {
                  return prefs().getString(COOKIE_KEY,"");
              }

              private void saveCookie(String cookie) {
                  if (cookie == null || cookie.isEmpty()) return;
                  prefs().edit().putString(COOKIE_KEY,cookie).apply();
              }

              private void clearCookie() {
                  prefs().edit().remove(COOKIE_KEY).apply();
              }

              private void loadSongs() {
                  content.addView(label("Loading songs…",14,muted,false));
                  new Thread(() -> {
                      String body = null;
                      String error = null;
                      HttpURLConnection c = null;
                      try {
                          URL u = new URL(API + "/api/db/songs?select=id,title,artist,genre,plays,cover_url,audio_url&eq.approved=1&order=created_at.desc&limit=50");
                          c = (HttpURLConnection)u.openConnection();
                          c.setConnectTimeout(12000);
                          c.setReadTimeout(12000);
                          c.setRequestProperty("Accept","application/json");
                          int code = c.getResponseCode();
                          BufferedReader r = new BufferedReader(new InputStreamReader(
                              code >= 200 && code < 300 ? c.getInputStream() : c.getErrorStream()));
                          StringBuilder b = new StringBuilder();
                          String line;
                          while ((line=r.readLine()) != null) b.append(line);
                          r.close();
                          if (code >= 200 && code < 300) body = b.toString();
                          else error = "Song service returned HTTP " + code;
                      } catch (Exception e) {
                          error = "Unable to load songs. Check your internet connection.";
                      } finally {
                          if (c != null) c.disconnect();
                      }
                      final String data = body, problem = error;
                      runOnUiThread(() -> {
                          if (isFinishing() || content == null) return;
                          if (data == null) {
                              content.addView(label(problem,14,muted,false));
                              action("Try again",this::loadSongs);
                              return;
                          }
                          try {
                              Object parsed = new org.json.JSONTokener(data).nextValue();
                              JSONArray songs = parsed instanceof JSONArray ? (JSONArray)parsed :
                                  parsed instanceof JSONObject ? ((JSONObject)parsed).optJSONArray("data") : null;
                              if (songs == null || songs.length() == 0) {
                                  content.addView(label("No approved songs found.",14,muted,false));
                                  return;
                              }
                              for (int i=0;i<songs.length();i++) {
                                  JSONObject song = songs.optJSONObject(i);
                                  if (song == null) continue;
                                  String name = song.optString("title","Untitled song");
                                  String by = song.optString("artist","Unknown artist");
                                  String genre = song.optString("genre","Music");
                                  String playsCount = song.optString("plays","0");
                                  LinearLayout row = column();
                                  row.setBackgroundColor(panel);
                                  row.setPadding(dp(14),dp(14),dp(14),dp(14));
                                  row.addView(label(name,16,white,true));
                                  gap(row,5);
                                  row.addView(label(by+" • "+genre+" • "+playsCount+" plays",12,muted,false));
                                  gap(row,8);
                                  row.addView(label("▶ PLAY SONG",12,orange,true));
                                  row.setOnClickListener(v -> playSong(song));
                                  LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(-1,-2);
                                  p.bottomMargin = dp(10);
                                  content.addView(row,p);
                              }
                          } catch (Exception e) {
                              content.addView(label("Unexpected song data format.",14,muted,false));
                          }
                      });
                  }).start();
              }

              private void playSong(JSONObject song) {
                  String url = song.optString("audio_url","").trim();
                  if (!url.startsWith("https://")) {
                      Toast.makeText(this,"This song has no valid secure audio URL.",Toast.LENGTH_LONG).show();
                      return;
                  }
                  releasePlayer();
                  int id = ++token;
                  title = song.optString("title","Untitled song");
                  artist = song.optString("artist","Unknown artist");
                  audioUrl = url;
                  preparing = true;
                  playing = false;
                  screen("Player");

                  new Thread(() -> {
                      MediaPlayer mp = new MediaPlayer();
                      try {
                          mp.setAudioAttributes(new AudioAttributes.Builder()
                              .setUsage(AudioAttributes.USAGE_MEDIA)
                              .setContentType(AudioAttributes.CONTENT_TYPE_MUSIC).build());
                          mp.setDataSource(url);
                          mp.setOnPreparedListener(p -> runOnUiThread(() -> {
                              if (id != token || isFinishing()) {
                                  p.release();
                                  return;
                              }
                              player = p;
                              preparing = false;
                              try {
                                  p.start();
                                  playing = true;
                                  screen("Player");
                              } catch (Exception e) {
                                  Toast.makeText(this,"Unable to start playback.",Toast.LENGTH_LONG).show();
                              }
                          }));
                          mp.setOnCompletionListener(p -> runOnUiThread(() -> {
                              if (id == token) {
                                  playing = false;
                                  if (!isFinishing()) screen("Player");
                              }
                          }));
                          mp.setOnErrorListener((p, what, extra) -> {
                              runOnUiThread(() -> {
                                  if (id != token) return;
                                  audioUrl = "";
                                  releasePlayer();
                                  Toast.makeText(this,"This audio could not be played.",Toast.LENGTH_LONG).show();
                                  if (!isFinishing()) screen("Player");
                              });
                              return true;
                          });
                          mp.prepareAsync();
                      } catch (Exception e) {
                          try { mp.release(); } catch (Exception ignored) {}
                          runOnUiThread(() -> {
                              if (id == token) {
                                  audioUrl = "";
                                  preparing = false;
                                  Toast.makeText(this,"Could not load this audio.",Toast.LENGTH_LONG).show();
                                  if (!isFinishing()) screen("Player");
                              }
                          });
                      }
                  }).start();
              }

              private void toggle() {
                  if (player == null || preparing) return;
                  try {
                      if (player.isPlaying()) {
                          player.pause();
                          playing = false;
                      } else {
                          player.start();
                          playing = true;
                      }
                      screen("Player");
                  } catch (Exception e) {
                      Toast.makeText(this,"Playback is unavailable.",Toast.LENGTH_SHORT).show();
                  }
              }

              private void stopPlayback() {
                  releasePlayer();
                  audioUrl = "";
                  title = "";
                  artist = "";
                  screen("Player");
              }

              private void releasePlayer() {
                  token++;
                  MediaPlayer old = player;
                  player = null;
                  preparing = false;
                  playing = false;
                  if (old != null) {
                      try { old.setOnPreparedListener(null); } catch (Exception ignored) {}
                      try { old.setOnCompletionListener(null); } catch (Exception ignored) {}
                      try { old.setOnErrorListener(null); } catch (Exception ignored) {}
                      try { old.stop(); } catch (Exception ignored) {}
                      try { old.release(); } catch (Exception ignored) {}
                  }
              }

              @Override
              protected void onStop() {
                  super.onStop();
                  if (player != null) {
                      try {
                          if (player.isPlaying()) {
                              player.pause();
                              playing = false;
                          }
                      } catch (Exception ignored) {}
                  }
              }

              @Override
              protected void onDestroy() {
                  releasePlayer();
                  super.onDestroy();
              }
          }
          EOF

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace assembleDebug 2>&1 | tee build.log

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NileSoniQ-Build-Logs
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify APK
        if: success()
        shell: bash
        run: |
          set -euxo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NileSoniQ-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
