name: Build NileSoniQ Auto Logo
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build APK
        run: |
          ls -lh icon.png
          mkdir -p app/src/main/java/com/nilesoniq/app
          mkdir -p app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-mdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi app/src/main/res/mipmap-xxxhdpi app/src/main/res/values
          cp icon.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp icon.png app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp icon.png app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp icon.png app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp icon.png app/src/main/res/mipmap-mdpi/ic_launcher.png
          python3 << 'PY'
          import os
          os.makedirs("app/src/main/java/com/nilesoniq/app", exist_ok=True)
          open("app/src/main/java/com/nilesoniq/app/MainActivity.java","w").write('package com.nilesoniq.app;\nimport android.os.Bundle;\nimport android.webkit.WebView;\nimport android.webkit.WebViewClient;\nimport androidx.appcompat.app.AppCompatActivity;\npublic class MainActivity extends AppCompatActivity {\n WebView wv;\n @Override protected void onCreate(Bundle b){\n  super.onCreate(b);\n  wv=new WebView(this);\n  wv.getSettings().setJavaScriptEnabled(true);\n  wv.getSettings().setDomStorageEnabled(true);\n  wv.setWebViewClient(new WebViewClient());\n  wv.loadUrl("https://nilesoniq.com");\n  setContentView(wv);\n }\n @Override public void onBackPressed(){ if(wv.canGoBack()) wv.goBack(); else super.onBackPressed(); }\n}\n')
          open("app/src/main/AndroidManifest.xml","w").write('<?xml version="1.0" encoding="utf-8"?>\n<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n <uses-permission android:name="android.permission.INTERNET"/>\n <application android:label="NileSoniQ" android:icon="@mipmap/ic_launcher" android:theme="@android:style/Theme.NoTitleBar">\n  <activity android:name="com.nilesoniq.app.MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity>\n </application>\n</manifest>\n')
          open("app/src/main/res/values/strings.xml","w").write('<resources><string name="app_name">NileSoniQ</string></resources>')
          open("app/build.gradle","w").write('plugins { id "com.android.application" }\nandroid { namespace "com.nilesoniq.app"\n compileSdk 34\n defaultConfig { applicationId "com.nilesoniq.app"; minSdk 21; targetSdk 34; versionCode 22; versionName "4.0-phone" }\n compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 } }\ndependencies { implementation "androidx.appcompat:appcompat:1.6.1" }\n')
          open("build.gradle","w").write('buildscript { repositories { google(); mavenCentral() } dependencies { classpath "com.android.tools.build:gradle:8.1.4" } }\nallprojects { repositories { google(); mavenCentral() } }\n')
          open("settings.gradle","w").write("include ':app'")
          PY
      - uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.5
          arguments: assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: NileSoniQ-Phone-APK
          path: app/build/outputs/apk/debug/app-debug.apk
