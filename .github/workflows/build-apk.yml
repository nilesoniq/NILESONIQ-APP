              private void dashboardPlaysStats(JSONArray songs, long totalPlays, int approved, int pending, int rejected) {
                  content.removeAllViews();
                  heading("Total Plays Statistics", "Your songs' recorded listening performance");
                  card("Total recorded plays", String.valueOf(totalPlays) + "\nSongs tracked: " + songs.length() + "\nApproved songs: " + approved + "\nPending review: " + pending + "\nRejected songs: " + rejected);
                  java.util.ArrayList<JSONObject> ranked = new java.util.ArrayList<>();
                  for (int i = 0; i < songs.length(); i++) { JSONObject song = songs.optJSONObject(i); if (song != null) ranked.add(song); }
                  java.util.Collections.sort(ranked, (a, b) -> Long.compare(Math.max(0, firstLong(b, "plays", "total_plays", "play_count")), Math.max(0, firstLong(a, "plays", "total_plays", "play_count"))));
                  final java.util.ArrayList<JSONObject> topSongs = new java.util.ArrayList<>(ranked.subList(0, Math.min(7, ranked.size())));
                  LinearLayout panel = column();
                  panel.setBackground(rounded(Color.WHITE, 16, border)); panel.setElevation(dp(2)); panel.setPadding(dp(15), dp(14), dp(15), dp(14));
                  panel.addView(label("Plays by Song", 17, white, true)); gap(panel, 5);
                  panel.addView(label("Top 7 songs · real play totals returned by the API", 11, muted, false));
                  View graph = new View(this) {
                      private final android.graphics.Paint paint = new android.graphics.Paint(android.graphics.Paint.ANTI_ALIAS_FLAG);
                      @Override protected void onDraw(android.graphics.Canvas canvas) {
                          super.onDraw(canvas);
                          float left=dp(30), right=getWidth()-dp(8), top=dp(10), bottom=getHeight()-dp(34);
                          if (right<=left || bottom<=top) return;
                          paint.setColor(border); paint.setStrokeWidth(dp(1));
                          for(int i=0;i<4;i++){ float y=top+(bottom-top)*i/3f; canvas.drawLine(left,y,right,y,paint); }
                          long max=1; for(JSONObject song:topSongs) max=Math.max(max,Math.max(0,firstLong(song,"plays","total_plays","play_count")));
                          if(topSongs.isEmpty()){ paint.setColor(muted); paint.setTextSize(dp(12)); canvas.drawText("No song play totals available",left,(top+bottom)/2f,paint); return; }
                          float slot=(right-left)/topSongs.size();
                          for(int i=0;i<topSongs.size();i++){
                              JSONObject song=topSongs.get(i); long value=Math.max(0,firstLong(song,"plays","total_plays","play_count"));
                              float h=(bottom-top)*value/(float)max, x=left+i*slot+slot*0.2f, w=Math.max(dp(5),slot*0.6f);
                              paint.setColor(orange); paint.setStyle(android.graphics.Paint.Style.FILL); canvas.drawRoundRect(x,bottom-h,x+w,bottom,dp(3),dp(3),paint);
                              paint.setColor(muted); paint.setTextSize(dp(9)); String name=song.optString("title","Song"); if(name.length()>7) name=name.substring(0,7); canvas.drawText(name,x-dp(2),getHeight()-dp(8),paint);
                          }
                      }
                  };
                  panel.addView(graph,new LinearLayout.LayoutParams(-1,dp(160)));
                  LinearLayout.LayoutParams pp=new LinearLayout.LayoutParams(-1,-2); pp.bottomMargin=dp(14); content.addView(panel,pp);
                  for(JSONObject song:topSongs) card(song.optString("title","Untitled song"),"Recorded plays: "+Math.max(0,firstLong(song,"plays","total_plays","play_count")));
                  card("About this graph","This graph compares real play totals per song. A daily or weekly timeline requires dated play-history records from the server; no historical values are invented.");
                  action("Back to Artist Dashboard",this::artistDashboard);
              }

