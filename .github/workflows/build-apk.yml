name: Build NileSoniQ APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Create Android Project
        run: |
          mkdir -p app/src/main/java/com/nilesoniq/app
          mkdir -p app/src/main/res/values
          cat > app/src/main/java/com/nilesoniq/app/MainActivity.java << 'EOF'
          package com.nilesoniq.app;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          public class MainActivity extends Activity {
            public void onCreate(Bundle b){
              super.onCreate(b);
              WebView wv = new WebView(this);
              wv.getSettings().setJavaScriptEnabled(true);
              wv.getSettings().setDomStorageEnabled(true);
              wv.setWebViewClient(new WebViewClient());
              wv.loadUrl("https://nilesoniq.com");
              setContentView(wv);
            }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.nilesoniq.app">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:label="NileSoniQ" android:theme="@android:style/Theme.NoTitleBar">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > app/src/main/res/values/strings.xml << 'EOF'
          <resources><string name="app_name">NileSoniQ</string></resources>
          EOF
          cat > app/build.gradle << 'EOF'
          apply plugin: 'com.android.application'
          android {
            compileSdkVersion 34
            defaultConfig {
              applicationId "com.nilesoniq.app"
              minSdkVersion 21
              targetSdkVersion 34
              versionCode 1
              versionName "1.0"
            }
          }
          dependencies {}
          EOF
          cat > build.gradle << 'EOF'
          buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.1.0' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF
          cat > settings.gradle << 'EOF'
          include ':app'
          EOF
          cat > gradlew << 'EOF'
          #!/bin/sh
          exec gradle "$@"
          EOF
          chmod +x gradlew
      - name: Build with Gradle
        uses: gradle/gradle-build-action@v2
        with:
          arguments: assembleDebug
          gradle-version: 8.5
      - uses: actions/upload-artifact@v4
        with:
          name: NileSoniQ-APK
          path: app/build/outputs/apk/debug/app-debug.apk
